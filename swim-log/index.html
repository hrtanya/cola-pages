/* ===== 4x100 接力：挑三个伙伴，一起游 ===== */
function friendPower(f){ return Math.round(55 + (f.aff||0)*0.45); }
function relayRow(f, i){
  const on = window._relaySel.indexOf(i) > -1;
  return '<button class="pBtn'+(on?' on':'')+'" onclick="relayPick('+i+')">'+f.name+'（'+f.city+'）战力 '+friendPower(f)+(on?' ✓':'')+'</button>';
}
function relayPick(i){
  const sel = window._relaySel;
  const at = sel.indexOf(i);
  if(at > -1) sel.splice(at,1);
  else { if(sel.length>=3){ toast('最多带三个伙伴'); return; } sel.push(i); }
  sfx('tap');
  drawRelayModal();
}
function drawRelayModal(){
  const sel = window._relaySel;
  const fsum = sel.reduce((a,i)=>a+friendPower(S.friends[i]),0);
  showModal('4 × 100 接 力',
    '挑三个队友站上出发台——<b>他们的好感度就是战力</b>。<br><br><span style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">'
    + S.friends.map((f,i)=>relayRow(f,i)).join('') + '</span><br><br>已选 <b>'+sel.length+'/3</b> · 队伍战力 <b>'+(fsum? fsum + 100 : '—')+'</b>',
    sel.length===3 ? [{label:'出 发 台 见', cb:runRelay}] : [{label:'人还没挑够', cb:()=>{}}]);
}
function offerRelay(){
  window._relaySel = [];
  if($('modal').classList.contains('on') || _mq.length){ _mq.push({fn:offerRelay}); return; }
  drawRelayModal();
}
function runRelay(){
  const sel = window._relaySel || [];
  const mates = sel.map(i=>S.friends[i]).filter(Boolean);
  if(mates.length < 3){ toast('人还没挑够'); return; }
  openSwimGame(hits=>runRelayResult(mates, hits), {rounds:8, title:'接 力 · 第 四 棒'});
}
function runRelayResult(mates, hits){
  const w = strokeW();
  const mine = S.talent*w.talent + S.tech*w.tech + S.strength*w.strength + S.diligence*w.dil + (100-S.fatigue)*0.10 + R(14)-7 + (hits*2-8);
  const fsum = mates.reduce((a,f)=>a+friendPower(f),0);
  const team = mine*0.34 + fsum*0.22 + R(10)-5;
  const tier = MEET_TIERS[Math.min(S.trialIdx, MEET_TIERS.length)-1];
  let better = 0;
  for(let i=0;i<7;i++){
    const rv = tier.rivals[0]*0.9 + Math.random()*(tier.rivals[1]-tier.rivals[0])*0.9;
    if(rv > team) better++;
  }
  const rank = better+1;
  let txt = '';
  if(rank===1){
    gainItem('relay');
    mates.forEach(f=>{ f.aff = Math.min(100,(f.aff||0)+3); checkAffStage(f); });
    txt = '四道水花叠成一道。<b>冠军！</b>纪念棒人手一根——不对，只有你手账里有。三位伙伴好感 +3。';
    sfx('win');
  } else {
    txt = '第<b>'+rank+'</b>名。交接棒没有掉，就已经是最好的结果。';
  }
  addLog('4x100 接力（与'+mates.map(f=>f.name).join('、')+'）：第'+rank+'名。', true);
  save();
  showModal('接 力 · 结 果',
    '出检录口的时候，三个伙伴互相拍了拍肩膀。<br><br>你的这一棒：划水节奏 '+hits+'/8<br>队伍总战力：'+Math.round(team)+'<br><br>'+txt);
}

/* ===== 房间：一面会收集回忆的墙 ===== */
const ROOM_CARD_SLOTS  = [{x:36,y:54},{x:114,y:54},{x:192,y:54},{x:36,y:116},{x:114,y:116},{x:192,y:116}];
const ROOM_SHELF_SLOTS = [{x:300,y:186},{x:352,y:186},{x:404,y:186},{x:300,y:244},{x:352,y:244},{x:404,y:244}];
const _roomImgs = {};
function roomImg(url){
  if(!url) return null;
  if(_roomImgs[url]) return _roomImgs[url].ok ? _roomImgs[url].img : null;
  const im = new Image();
  const rec = {img:im, ok:false};
  im.onload = ()=>{ rec.ok = true; drawRoom(); };
  im.src = url;
  _roomImgs[url] = rec;
  return null;
}
function itemName(key){
  if(key.indexOf('card@')===0){ return key.split('@')[1]+'明信片'; }
  if(key.indexOf('plush@')===0){ return key.split('@')[1]+'吉祥物'; }
  const sv = SOUVENIRS.find(x=>x.id===key);
  return sv ? sv.name : key;
}
function itemIcon(key){
  if(key.indexOf('card@')===0) return '🏙️';
  if(key.indexOf('plush@')===0) return '🧸';
  const sv = SOUVENIRS.find(x=>x.id===key);
  return sv ? sv.icon : '🎁';
}
function itemPix(key){
  if(key.indexOf('card@')===0){
    const po = photoOf(key.split('@')[1]);
    return po && po.pix ? po.pix : null;
  }
  return null;
}
function drawRoom(){
  const cv = $('roomWall'); if(!cv) return;
  const g = cv.getContext('2d');
  if(!S.wall) S.wall = {card:{}, shelf:{}};
  const P = (x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(x,y,w,h); };
  // 灰紫墙面 + 踢脚线 + 地板
  const grad = g.createLinearGradient(0,0,0,300);
  grad.addColorStop(0,'#9d92b2'); grad.addColorStop(1,'#b3a8c4');
  g.fillStyle = grad; g.fillRect(0,0,480,268);
  P(0,268,480,10,'#6d637f'); P(0,278,480,22,'#4a4158');
  // 窗（夜空随季节换景，呼应泳池夜色）
  const WSE = [
    {sky:'#22405a', moon:'#f2e8c8', extra:'petal'},
    {sky:'#16324a', moon:'#f2e8c8', extra:'firefly'},
    {sky:'#2b2440', moon:'#e8b06a', extra:'leaf'},
    {sky:'#1a2a44', moon:'#dfe6f2', extra:'snow'}
  ];
  const wse = WSE[seasonOf(S.day)];
  P(368,36,84,96,'#3a3550'); P(372,40,76,88,'#1d3a52'); P(374,42,72,84,wse.sky);
  g.fillStyle=wse.moon; g.beginPath(); g.arc(424,66,12,0,7); g.fill();
  P(374,60,72,2,'rgba(255,255,255,.15)'); P(374,84,72,2,'rgba(255,255,255,.12)'); P(374,108,72,2,'rgba(255,255,255,.10)');
  if(wse.extra==='petal'){
    g.fillStyle='rgba(236,170,196,.85)';
    [[382,52],[400,72],[416,96],[388,112],[432,50]].forEach(pt=>{ g.fillRect(pt[0],pt[1],3,2); g.fillRect(pt[0]+1,pt[1]-2,2,2); });
  }else if(wse.extra==='firefly'){
    g.fillStyle='rgba(255,236,150,.9)';
    [[384,56],[406,74],[428,98],[392,114]].forEach(pt=>{ g.fillRect(pt[0],pt[1],2,2); });
  }else if(wse.extra==='leaf'){
    g.fillStyle='rgba(216,138,74,.9)';
    [[380,58],[398,76],[420,92],[434,112]].forEach(pt=>{ g.fillRect(pt[0],pt[1],4,2); g.fillRect(pt[0]+1,pt[1]+2,2,2); });
  }else{
    g.fillStyle='rgba(240,244,252,.9)';
    [[382,50],[396,64],[414,58],[430,74],[388,90],[408,100],[424,112],[380,118]].forEach(pt=>{ g.fillRect(pt[0],pt[1],2,2); });
    P(374,122,72,4,'rgba(232,236,242,.95)');
  }
  P(406,40,4,88,'#3a3550'); P(372,80,76,4,'#3a3550');
  // 串灯
  const LC = ['#ffe28a','#a8e6cf','#e8a0c0','#aee5f2'];
  g.strokeStyle='rgba(255,255,255,.35)';
  g.beginPath(); g.moveTo(20,26); g.quadraticCurveTo(240,46,460,26); g.stroke();
  for(let i=0;i<12;i++){
    const t=i/11, x=20+t*440, y=26+Math.sin(t*Math.PI)*14;
    g.fillStyle=LC[i%4]; g.beginPath(); g.arc(x,y+5,3.4,0,7); g.fill();
  }
  // 软木板 + 白框明信片槽
  P(24,44,262,158,'#c9a878'); P(24,44,262,4,'#a8885c'); P(24,198,262,4,'#a8885c');
  ROOM_CARD_SLOTS.forEach((sl,i)=>{
    const key = S.wall.card[i];
    P(sl.x-3,sl.y-3,72,56,'#f7f4ec'); // 拍立得白框
    if(key){
      const pix = itemPix(key);
      const im = pix ? roomImg(pix) : null;
      if(im){ g.drawImage(im, sl.x, sl.y, 66, 44); }
      else {
        P(sl.x,sl.y,66,44,'#8fb8cc');
        P(sl.x,sl.y+26,66,18,'#6d98ad');
      }
      g.fillStyle='#d65a5a'; g.beginPath(); g.arc(sl.x+33,sl.y-1,3,0,7); g.fill();
    } else {
      P(sl.x,sl.y,66,44,'rgba(0,0,0,.12)');
      g.fillStyle='rgba(255,255,255,.5)'; g.font='16px sans-serif'; g.textAlign='center';
      g.fillText('+', sl.x+33, sl.y+28);
    }
  });
  // 木搁板 x2 + 纪念品
  [186,244].forEach(sy=>{
    P(292,sy+40,152,6,'#8a6a4a'); P(292,sy+46,152,4,'#6d5238');
    const brg = g.createLinearGradient(0,sy,0,sy+40); brg.addColorStop(0,'rgba(0,0,0,0)'); brg.addColorStop(1,'rgba(0,0,0,.18)');
    g.fillStyle=brg; g.fillRect(292,sy,152,40);
  });
  ROOM_SHELF_SLOTS.forEach((sl,i)=>{
    const key = S.wall.shelf[i];
    if(key){
      g.font='30px serif'; g.textAlign='center';
      g.fillText(itemIcon(key), sl.x+20, sl.y+32);
      g.fillStyle='rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(sl.x+20,sl.y+41,14,3,0,0,7); g.fill();
    } else {
      g.fillStyle='rgba(255,255,255,.28)'; g.font='18px sans-serif'; g.textAlign='center';
      g.fillText('·', sl.x+20, sl.y+26);
    }
  });
  // 奖牌轨：按奖牌数画奖牌
  P(24,224,240,4,'#8a6a4a');
  const medals = [];
  for(let i=0;i<S.medals.gold;i++) medals.push('#ffd76a');
  for(let i=0;i<S.medals.silver;i++) medals.push('#d9d9e2');
  for(let i=0;i<S.medals.bronze;i++) medals.push('#d99a5a');
  medals.slice(0,10).forEach((c,i)=>{
    const mx = 36+i*23;
    g.strokeStyle='#c9c2b2'; g.beginPath(); g.moveTo(mx,224); g.lineTo(mx,238); g.stroke();
    g.fillStyle=c; g.beginPath(); g.arc(mx,245,7,0,7); g.fill();
    g.fillStyle='rgba(0,0,0,.2)'; g.beginPath(); g.arc(mx-2,243,2.4,0,7); g.fill();
  });
  // 右下角：床头小桌 + 台灯
  P(372,240,92,28,'#5a4636'); P(380,214,8,26,'#5a4636');
  P(376,196,16,20,'#e8c88a'); P(380,216,4,4,'#5a4636');
  g.fillStyle='rgba(232,200,138,.25)'; g.beginPath(); g.moveTo(376,214); g.lineTo(392,214); g.lineTo(404,268); g.lineTo(364,268); g.fill();
  // 足迹
  const cn = CITIES.filter(c=>S.dex.cn[c]).length, it = INT_LOCS.filter(l=>S.dex.intl[l.country]).length;
  // 文字清晰化：小字搬到 HTML 标签层
  const lb = $('roomLabels');
  if(lb){
    let h = '';
    ROOM_CARD_SLOTS.forEach((sl,i)=>{
      const key = S.wall.card[i];
      if(key) h += '<span class="rlab" style="left:'+((sl.x+33)/4.8)+'%;top:'+((sl.y+34)/3)+'%">'+key.split('@')[1]+'</span>';
    });
    h += '<span class="rlab rlabL" style="left:5%;top:'+(257/3)+'%">奖牌 🥇'+S.medals.gold+' 🥈'+S.medals.silver+' 🥉'+S.medals.bronze+'</span>';
    h += '<span class="rlab rlabL" style="left:'+(330/4.8)+'%;top:'+(284/3)+'%">足迹 '+cn+'/'+CITIES.length+' · '+it+'/'+INT_LOCS.length+'</span>';
    lb.innerHTML = h;
  }
}
function roomClick(e){
  const cv = $('roomWall');
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (cv.width/r.width);
  const y = (e.clientY - r.top) * (cv.height/r.height);
  const hit = (sl)=> x>=sl.x-4 && x<=sl.x+74 && y>=sl.y-4 && y<=sl.y+56;
  for(const i in S.wall.card){
    if(hit(ROOM_CARD_SLOTS[i])){ openWallCard(S.wall.card[i]); return; }
  }
  for(const i in S.wall.shelf){
    const sl = ROOM_SHELF_SLOTS[i];
    if(x>=sl.x-4 && x<=sl.x+44 && y>=sl.y-4 && y<=sl.y+48){ tapItem(S.wall.shelf[i]); return; }
  }
}
/* 点墙上钉着的明信片：看大图，想取下在弹窗里一键取 */
function openWallCard(key){
  const place = key.split('@')[1];
  const ph = photoOf(place);
  showModal(place+'明信片', pcImgHtml(ph, place), [
    {label:'从墙上取下来', cb:()=>{
      for(const i in S.wall.card){
        if(S.wall.card[i]===key){ delete S.wall.card[i]; sfx('page'); save(); render(); toast('已取下 · '+place+'明信片'); return; }
      }
    }},
    {label:'留在墙上', cb:()=>{}}
  ]);
}
function renderRoom(){
  const box = $('roomBtns'); if(!box) return;
  const cards = Object.keys(S.items).filter(k=>k.indexOf('card@')===0);
  const shelfs = Object.keys(S.items).filter(k=>k.indexOf('plush@')===0 || SOUVENIRS.some(sv=>sv.id===k));
  const usedCard = Object.keys(S.wall.card).length, usedShelf = Object.keys(S.wall.shelf).length;
  let html = '';
  const hangBtn = (key, kind, full)=>{
    const hung = Object.values(S.wall[kind]).indexOf(key) > -1;
    return '<button class="pBtn" onclick="roomToggle(\''+kind+'\',\''+key+'\')">'+itemIcon(key)+' '+itemName(key)+(hung?'（取下）':(full?'（满了）':'（挂上）'))+'</button>';
  };
  cards.forEach(k=>{ html += hangBtn(k, 'card', usedCard>=6 && Object.values(S.wall.card).indexOf(k)<0); });
  shelfs.forEach(k=>{ html += hangBtn(k, 'shelf', usedShelf>=6 && Object.values(S.wall.shelf).indexOf(k)<0); });
  box.innerHTML = html || '<div class="hint">比赛和训练会带来明信片和纪念品——拿到手就能钉上这面墙。</div>';
  $('roomHint').textContent = '墙上能钉 6 张明信片、摆 6 件纪念品；点墙上的明信片可以看大图（里面能取下来），取下纪念品用下面的「取下」按钮。奖牌会自己挂上奖牌轨。';
}
function roomToggle(kind, key){
  const wall = S.wall[kind];
  const cur = Object.values(wall).indexOf(key);
  if(cur > -1){ delete wall[Object.keys(wall)[cur]]; }
  else {
    const cap = kind==='card' ? 6 : 6;
    if(Object.keys(wall).length >= cap){ toast('墙上满了，先取下一件'); return; }
    let slot = 0;
    while(wall[slot]!==undefined) slot++;
    wall[slot] = key;
    sfx('sparkle');
  }
  save(); render();
}

/* ================= 新手指引 ================= */
const TUT_TABS = [
  ['log','手账','每天发生的事都会写在这里，随时可以回来翻。'],
  ['friends','好友','比赛认识的朋友都在这里——聊天、送礼养好感，好友越多训练加成越高。'],
  ['items','收藏','比赛和训练时捡到的明信片、纪念品都收在这里。'],
  ['mail','信箱','粉丝的来信会寄到这里，记得读。'],
  ['yearly','年页','每年过生日会收到一张年度总结，替你记下这一年。'],
  ['gear','道具','赞助商装备和扭蛋机在这里——买装备会分心，但关键时刻能救命。'],
  ['dex','房间','这是你的房间，奖牌和纪念品都可以摆上墙。'],
  ['medals','战绩','比赛记录、奖牌数和结局图鉴都在这里。'],
  ['ach','成就','解锁过的成就会永久点亮。']
];
let _tut = null;
function tutAim(el, text, interactive){
  const hi = $('tutHi');
  $('tutTipText').textContent = text;
  $('tutNext').style.display = interactive ? 'none' : '';
  hi._target = interactive ? el : null;
  hi.style.cursor = interactive ? 'pointer' : 'default';
  const place = ()=>{
    const r = el.getBoundingClientRect(), pad = 6;
    hi.style.left = (r.left-pad)+'px'; hi.style.top = (r.top-pad)+'px';
    hi.style.width = (r.width+pad*2)+'px'; hi.style.height = (r.height+pad*2)+'px';
  };
  place();
  hi._place = place;
  window.addEventListener('scroll', place, true);
  window.addEventListener('resize', place);
  hi.onclick = ()=>{ if(hi._target) tutForward(hi._target.getAttribute('onclick')||''); };
}
function tutAimFree(){
  $('tutTipText').textContent = '来，自己试试——选一格，完成今天的安排。';
  $('tutNext').style.display = 'none';
  document.querySelectorAll('.act').forEach(b=>{
    const box = document.createElement('div');
    box.className = 'tutHiM';
    const place = ()=>{
      const r = b.getBoundingClientRect(), pad = 5;
      box.style.left = (r.left-pad)+'px'; box.style.top = (r.top-pad)+'px';
      box.style.width = (r.width+pad*2)+'px'; box.style.height = (r.height+pad*2)+'px';
    };
    place();
    window.addEventListener('scroll', place, true);
    window.addEventListener('resize', place);
    box._place = place;
    box.onclick = ()=>{ tutForward(b.getAttribute('onclick')||''); };
    $('tutWrap').appendChild(box);
  });
}
function tutShow(step){
  _tut = { step: step };
  S.tut = step; save();
  $('tutWrap').classList.add('on');
  if(step === 0){
    tutAim($('actions'), '这里是「今日安排」——每回合点击任意一格，就能完成当天的动作。', false);
  }else if(step >= 1 && step <= TUT_TABS.length){
    const t = TUT_TABS[step-1];
    document.querySelector('.tab[data-tab="'+t[0]+'"]').click();
    tutAim(document.querySelector('.tab[data-tab="'+t[0]+'"]'), '「'+t[1]+'」· '+t[2], false);
  }else if(step === TUT_TABS.length + 1){
    tutAimFree();
  }
}
function tutNextStep(){ sfx('tap'); tutShow(_tut.step + 1); }
function tutForward(attr){
  if(!_tut) return;
  tutCleanup();
  S.tut = 'done'; save();
  const m = (attr||'').match(/doAction\('([a-zA-Z]+)'\)/);
  window._tutFinishing = true;
  if(m) doAction(m[1]);
  queueModal('出 发 吧',
    '现在可以自由开始你的游泳生涯！<br><br>更详细的玩法说明，可点击右上角的 <b>⚙ 设置</b> 查看。',
    [{label:'现 在 开 始 ！', cb:()=>{ setTimeout(showTutArrow, 350); }}]);
}
function tutCleanup(){
  _tut = null;
  $('tutWrap').classList.remove('on');
  document.querySelectorAll('.tutHiM').forEach(b=>{ if(b._place){ window.removeEventListener('scroll', b._place, true); window.removeEventListener('resize', b._place); } b.remove(); });
  const hi = $('tutHi');
  if(hi._place){ window.removeEventListener('scroll', hi._place, true); window.removeEventListener('resize', hi._place); hi._place = null; hi._target = null; }
}
function startTutorial(){
  S.tut = 0; save();
  tutShow(0);
}
function showTutArrow(){
  const b = $('btnSetting').getBoundingClientRect();
  const a = $('tutArrow');
  a.innerHTML = '更详细的玩法说明<br><b>点这里的 ⚙</b>';
  a.style.top = (b.bottom + 8)+'px';
  a.style.right = Math.max(8, window.innerWidth - b.right)+'px';
  a.classList.add('on');
  clearTimeout(showTutArrow._t);
  showTutArrow._t = setTimeout(()=>a.classList.remove('on'), 6000);
}
$('tutNext').onclick = tutNextStep;

/* ================= 启动 ================= */
if(load()){
  laneP = S.swimX || 0; laneTarget = laneP;
  render();
  if(S.over){ showEndSummary(); }
  else if(S.meet7 && S.meet7.on){ openPlane(); }
  else if(typeof S.tut === 'number'){ setTimeout(()=>tutShow(S.tut), 350); }
}
if(localStorage.getItem(SAVE_KEY)){ $('btnResume').style.display=''; $('btnAchHome').style.display=''; }
/* 开门第一问：新客还是老朋友 */
function showStartAsk(){
  showModal('游 泳 馆 开 门 了',

    [
      {label:'第一次玩', cb:()=>{ sfx('page'); showHelp(); }},
      {label:'在水里留下过痕迹', cb:()=>{ sfx('splash'); }}
    ]);
}
