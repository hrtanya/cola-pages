<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>破浪手账 · Swim Log</title>
<style>
  :root{
    --ink:#f2fbfd;
    --ink-soft:rgba(242,251,253,.62);
    --accent:#aee5f2;
    --line:rgba(255,255,255,.22);
    --glass:rgba(255,255,255,.10);
    --glass-h:rgba(255,255,255,.18);
    --warn:#ffc2ae;
    --good:#a8e6cf;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:#0d4a6a url('assets/pool-bg-pixel.png?v=1') center/cover fixed no-repeat;
    color:var(--ink);
    line-height:1.8;
    overflow-x:hidden;
  }
  /* 压暗 veil，保证文字可读 */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:linear-gradient(180deg, rgba(6,38,56,.28) 0%, rgba(5,32,48,.44) 55%, rgba(3,24,38,.58) 100%);
  }
  .genderRow{display:flex;gap:14px;justify-content:center;margin-top:2px;}
  .gBtn{
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);
    font-family:inherit;font-size:14px;padding:8px 36px;border-radius:999px;cursor:pointer;
    transition:all .2s;letter-spacing:.25em;
  }
  .gBtn.on{border-color:var(--accent);color:var(--accent);background:rgba(174,229,242,.08);}
  #btnHistory{margin-top:14px;}
  .pickRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .pBtn{border:1px solid var(--line);background:transparent;color:var(--ink-soft);font-family:inherit;font-size:12px;padding:5px 16px;border-radius:999px;cursor:pointer;transition:all .2s;letter-spacing:.15em;}
  .pBtn.on{border-color:var(--accent);color:var(--accent);background:rgba(174,229,242,.08);}
  .swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.25);transition:all .15s;padding:0;}
  .swatch.on{border-color:var(--accent);transform:scale(1.18);box-shadow:0 0 0 2px rgba(174,229,242,.35);}
  .laneRow{margin:14px 0 12px;}
  #laneCv{display:block;width:100%;height:72px;image-rendering:pixelated;}
  .wrap{max-width:680px;margin:0 auto;padding:48px 24px 96px;position:relative;z-index:1;}

  /* ---------- 创建页 ---------- */
  #screenCreate{text-align:center;padding-top:9vh;}
  .titleZh{font-size:34px;letter-spacing:.35em;margin-left:.35em;text-shadow:0 2px 18px rgba(13,74,106,.45);}
  .titleEn{font-size:13px;color:var(--ink-soft);letter-spacing:.28em;margin-top:8px;}
  .wave{margin:36px auto 40px;width:120px;height:2px;background:rgba(255,255,255,.4);}
  .field{margin:26px 0;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);letter-spacing:.2em;margin-bottom:8px;}
  .field input{
    width:220px;border:none;border-bottom:1px solid rgba(255,255,255,.4);background:transparent;
    padding:8px 4px;font-size:18px;color:var(--ink);text-align:center;outline:none;
    transition:border-color .25s;
  }
  .field input::placeholder{color:rgba(255,255,255,.38);}
  .field input:focus{border-color:var(--accent);}
  .btn{
    display:inline-block;border:1px solid rgba(255,255,255,.55);color:#f2fcff;background:transparent;
    padding:10px 34px;font-size:14px;letter-spacing:.25em;cursor:pointer;border-radius:999px;
    transition:all .25s;margin-top:34px;font-family:inherit;
  }
  .btn:hover{background:rgba(255,255,255,.16);}
  .btn.small{padding:6px 20px;font-size:12px;margin-top:0;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:14px;}
  .credit{font-size:11px;color:var(--ink-soft);margin-top:22px;letter-spacing:.08em;opacity:.85;}

  /* ---------- 游戏页 ---------- */
  #screenGame{display:none;}
  .head{text-align:center;margin-bottom:34px;}
  .head .name{font-size:22px;letter-spacing:.2em;text-shadow:0 2px 14px rgba(13,74,106,.4);}
  .head .sub{font-size:12px;color:var(--ink-soft);margin-top:4px;letter-spacing:.1em;}
  .traits{margin-top:12px;}
  .trait{
    display:inline-block;font-size:12px;color:var(--accent);
    border:1px solid rgba(174,229,242,.5);border-radius:999px;padding:2px 14px;margin:0 5px;
  }

  .btnSetting{
    position:fixed;top:14px;right:16px;z-index:60;display:none;
    width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.1);color:var(--paper);font-size:18px;cursor:pointer;
    backdrop-filter:blur(4px);transition:background .2s;
  }
  .btnSetting:hover{background:rgba(255,255,255,.22);}
  .setAvatarCv{display:block;margin:0 auto 6px;image-rendering:pixelated;width:96px;height:120px;}
  .setInfo{text-align:center;font-size:13px;margin-bottom:4px;}
  .setInfo .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .setDesc{margin:10px 0 2px;font-size:12px;color:var(--ink-soft);line-height:1.9;}
  .setRow{display:flex;align-items:center;margin:14px 0;font-size:13px;}
  .setRow .lb{width:60px;color:var(--ink-soft);flex-shrink:0;letter-spacing:.15em;}
  .setRow input[type=range]{flex:1;accent-color:var(--accent);margin:0 10px;}
  .setRow .vv{width:36px;text-align:right;font-size:12px;color:var(--ink-soft);}
  .renIn{
    flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
    border-radius:6px;padding:7px 10px;color:var(--paper);font-size:14px;font-family:inherit;letter-spacing:.1em;
  }
  .renIn::placeholder{color:rgba(255,255,255,.35);}

  .sec{margin:30px 0;}
  .secTitle{font-size:12px;color:var(--ink-soft);letter-spacing:.3em;margin-bottom:14px;}
  .barRow{display:flex;align-items:center;margin:10px 0;font-size:13px;}
  .barRow .lb{width:74px;color:var(--ink-soft);flex-shrink:0;}
  .bar{flex:1;height:6px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s;}
  .bar.fat i{background:var(--warn);}
  .bar.hp i{background:var(--good);}
  .barRow .num{width:52px;text-align:right;color:var(--ink-soft);font-size:12px;flex-shrink:0;}
  .badgeSick{
    display:inline-block;font-size:12px;color:var(--warn);border:1px solid rgba(255,194,174,.55);
    border-radius:999px;padding:1px 12px;margin-left:8px;
  }

  .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .act{
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;
    transition:all .25s;background:var(--glass);text-align:left;font-family:inherit;color:var(--ink);
  }
  .act:hover{border-color:rgba(255,255,255,.55);background:var(--glass-h);transform:translateY(-1px);}
  .act .t{font-size:14px;letter-spacing:.1em;}
  .act .d{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.6;}
  .act.wide{grid-column:1/-1;text-align:center;}
  .actTreat{border-color:rgba(255,194,174,.6);}
  .actTreat .t{color:var(--warn);}

  .tabs{display:flex;gap:26px;justify-content:center;margin:44px 0 18px;font-size:13px;color:var(--ink-soft);}
  .tab{cursor:pointer;letter-spacing:.2em;padding-bottom:4px;border-bottom:2px solid transparent;transition:all .2s;}
  .tab.on{color:var(--accent);border-color:var(--accent);}
  .panel{display:none;}
  .panel.on{display:block;}

  .logItem{padding:12px 2px;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .logItem .d{color:var(--ink-soft);font-size:12px;margin-right:10px;}
  .logItem.ev{color:var(--accent);}
  .logPager{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .pgBtn{
    min-width:32px;height:28px;padding:0 8px;border-radius:6px;cursor:pointer;
    border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);
    color:var(--paper);font-family:inherit;font-size:12px;
  }
  .pgBtn:hover{background:rgba(255,255,255,.18);}
  .pgBtn.on{background:var(--accent);border-color:var(--accent);color:#083048;}

  .friendCard{padding:16px 4px;border-bottom:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .favatar{width:36px;height:45px;image-rendering:pixelated;flex-shrink:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:6px;}
  .friendCard .fi{flex:1;}
  .friendCard .fn{font-size:14px;letter-spacing:.08em;}
  .friendCard .fn .city{color:var(--accent);font-size:12px;margin-left:10px;}
  .friendCard .fq{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .friendCard .fa{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .stageTag{font-size:11px;color:var(--good);border:1px solid rgba(168,230,207,.5);border-radius:999px;padding:0 8px;margin-left:8px;}
  .chatBtn{
    flex-shrink:0;border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--ink);
    font-size:12px;padding:5px 16px;border-radius:999px;cursor:pointer;transition:all .2s;font-family:inherit;letter-spacing:.15em;
  }
  .chatBtn:hover{background:rgba(255,255,255,.14);}

  .medalRow{display:flex;gap:34px;justify-content:center;margin:22px 0;}
  .medal{text-align:center;}
  .medal .m{font-size:26px;}
  .medal .c{font-size:12px;color:var(--ink-soft);letter-spacing:.15em;}
  .meetItem{padding:10px 2px;border-bottom:1px dashed var(--line);font-size:13px;color:var(--ink-soft);}
  .meetItem b{color:var(--ink);font-weight:normal;}

  .resetRow{text-align:center;margin-top:56px;}
  .resetRow span{font-size:12px;color:var(--ink-soft);cursor:pointer;letter-spacing:.15em;border-bottom:1px dashed var(--line);}

  /* ---------- 微信风聊天 ---------- */
  .wxChat{background:#ededed;border-radius:12px;padding:14px 12px;text-align:left;}
  .wxMsgs{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
  .wxRow{display:flex;align-items:flex-start;gap:8px;}
  .wxRow.me{flex-direction:row-reverse;}
  .wxAv{width:30px;height:30px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;}
  .bub{max-width:75%;background:#fff;color:#173140;border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.7;}
  .wxRow.me .bub{background:#95ec69;}
  .wxOpts{position:relative;height:150px;margin-top:18px;}
  .wxCard{position:absolute;left:50%;bottom:0;width:88px;height:122px;margin-left:-44px;transform-origin:50% 135%;transform:rotate(var(--rot,0deg));border:1px solid rgba(70,100,120,.45);border-radius:9px;background:linear-gradient(160deg,#4a7a9e,#2d5a7e);color:#dfeaf2;cursor:pointer;overflow:hidden;padding:0;font-family:inherit;box-shadow:0 4px 10px rgba(20,40,60,.35);transition:transform .22s ease, opacity .3s, border-color .3s, box-shadow .22s;}
  .wxCard:hover{transform:rotate(var(--rot,0deg)) translateY(-18px);box-shadow:0 12px 20px rgba(20,40,60,.45);z-index:40;}
  .wxCard .back{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;gap:3px;}
  .wxCard .back::before{content:'';position:absolute;inset:5px;border:1px solid rgba(255,255,255,.28);border-radius:6px;}
  .wxCard .back small{font-size:9px;letter-spacing:.3em;opacity:.7;}
  .wxCard .front{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:7px 6px;background:linear-gradient(160deg,#95ec69,#5aa85c);color:#173140;font-size:10.5px;line-height:1.45;text-align:center;border-radius:8px;}
  .wxCard.chosen{transform:translateY(-52px) scale(1.2);border-color:#5aa85c;box-shadow:0 16px 28px rgba(20,40,60,.5);z-index:50;}
  .wxCard.gone{opacity:0;transform:translateY(-8px) scale(.85);pointer-events:none;}
  .wxCard.open{border-color:#5aa85c;transform:translateY(-52px) scale(1.2);box-shadow:0 16px 28px rgba(20,40,60,.5);z-index:50;}
  .wxCard.open .front{display:flex;animation:cardFlip .45s ease;}
  .wxCard.open .back{display:none;}
  .wxCard.dim{opacity:.35;pointer-events:none;}
  .wxCard .delta{font-size:10.5px;margin-top:4px;font-weight:bold;}
  @keyframes cardFlip{0%{transform:rotateY(90deg) scale(.9);opacity:.4;}100%{transform:rotateY(0) scale(1);opacity:1;}}
  .wxOpt{background:#95ec69;color:#173140;border:none;border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer;font-family:inherit;text-align:left;line-height:1.6;transition:background .15s;}
  .wxOpt:hover{background:#8ce55e;}
  .wxEnd{background:transparent;border:1px dashed #b2b2b2;color:#8a8a8a;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;font-family:inherit;}

  /* ---------- 收藏 ---------- */
  .itemGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .itemCard{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--glass);}
  .itemCard .ic{font-size:26px;}
  .itemCard .nm{font-size:13.5px;margin-top:4px;}
  .itemCard .ct{font-size:12px;color:var(--ink-soft);line-height:1.6;}
  .heart{margin-right:2px;}
  .giftRow{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:10px 2px;font-size:13px;text-align:left;}

  /* ---------- 图鉴 ---------- */
  .dexGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .dexCell{border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;background:var(--glass);opacity:.4;transition:all .3s;cursor:pointer;}
  .dexCell:hover{border-color:rgba(174,229,242,.6);}
  .pcImg{width:100%;max-height:52vh;object-fit:cover;border-radius:12px;display:block;background:rgba(255,255,255,.08);min-height:120px;}
  .pcCap{font-size:12px;color:var(--ink-soft);margin-top:10px;letter-spacing:.2em;}
  .pcBig{font-size:60px;line-height:1.4;}
  .itemCard{cursor:pointer;}
  .itemCard:hover{border-color:rgba(174,229,242,.6);}
  .dexCell.on{opacity:1;border-color:rgba(174,229,242,.6);background:rgba(174,229,242,.10);}
  .dexCell .di{font-size:18px;}
  .dexCell .dn{font-size:11px;margin-top:2px;}
  .dexTitle{font-size:12px;color:var(--ink-soft);letter-spacing:.3em;margin:20px 0 10px;}
  .dexReward{font-size:12px;color:var(--good);margin-top:16px;line-height:2;}
  .pcImg.pixImg{image-rendering:pixelated;}

  /* ---------- 弹层 ---------- */
  #modal{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(4,32,46,.45);z-index:50;
  }
  /* 从设置里打开的玩法说明：要盖在设置弹窗上层 */
  #modal.above{z-index:58;}
  #modal.on{display:flex;}
  #setModal{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(4,32,46,.45);z-index:55;
  }
  #setModal.on{display:flex;}
  .modalCard{
    background:rgba(8,44,62,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.18);
    border-radius:18px;padding:40px 38px;max-width:400px;width:88%;
    max-height:88vh;overflow-y:auto;
    text-align:center;box-shadow:0 18px 50px rgba(4,32,46,.4);
  }
  .modalCard .mt{font-size:15px;letter-spacing:.25em;margin-bottom:16px;color:var(--accent);}
  .modalCard .mb{font-size:14px;line-height:2.1;}
  .modalCard .mb b{color:#fff;font-weight:normal;}
  #mdBtns{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  #mdBtns .btn{margin-top:0;}
  .toast{
    position:fixed;left:50%;bottom:40px;transform:translateX(-50%);
    background:rgba(8,44,62,.92);color:#fff;font-size:13px;padding:9px 24px;border-radius:999px;
    opacity:0;transition:opacity .4s;pointer-events:none;z-index:60;border:1px solid rgba(255,255,255,.15);
  }
  .toast.on{opacity:.95;}

  /* ---------- 训练节奏小游戏 ---------- */
  #swimGame{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,32,46,.55);z-index:55;}
  #swimGame.on{display:flex;}
  .sgCard{background:rgba(8,44,62,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:34px 30px;width:86%;max-width:380px;text-align:center;box-shadow:0 18px 50px rgba(4,32,46,.4);}
  .sgTitle{font-size:14px;letter-spacing:.25em;color:var(--accent);margin-bottom:8px;}
  .sgSub{font-size:12px;color:var(--ink-soft);margin-bottom:20px;min-height:18px;}
  .sgBar{position:relative;height:34px;border-radius:10px;background:rgba(255,255,255,.08);overflow:visible;margin-bottom:8px;}
  .sgZone{position:absolute;top:0;bottom:0;background:rgba(126,231,205,.35);border-left:1px solid rgba(126,231,205,.6);border-right:1px solid rgba(126,231,205,.6);border-radius:4px;}
  .sgCore{position:absolute;top:0;bottom:0;width:8px;background:rgba(126,231,205,.85);left:50%;transform:translateX(-50%);}
  .sgNeedle{position:absolute;top:-5px;bottom:-5px;width:3px;background:#fff;border-radius:2px;box-shadow:0 0 8px rgba(255,255,255,.8);}
  .sgTap{width:100%;margin-top:18px;}
  .sgDots{margin-top:14px;font-size:16px;letter-spacing:6px;min-height:22px;color:#fff;}
  .sgFan{display:none;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;font-size:12px;color:#ffe9b8;}
  #fanCv{image-rendering:pixelated;width:180px;height:42px;}

  /* ---------- 像素信封邀请函 ---------- */
  #envWrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,32,46,.62);z-index:56;}
  #envWrap.on{display:flex;}
  .envStage{position:relative;width:320px;height:620px;display:flex;align-items:flex-end;justify-content:center;}
  #envCv{display:block;image-rendering:pixelated;width:192px;height:144px;cursor:pointer;position:relative;z-index:2;}
  .envHint{position:absolute;bottom:-34px;width:100%;text-align:center;font-size:12px;color:#ffe9b8;letter-spacing:.25em;animation:hintFloat 1.6s ease-in-out infinite;}
  @keyframes hintFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .envLetter{position:absolute;left:50%;bottom:118px;width:272px;max-height:calc(100vh - 220px);overflow-y:auto;background:#fdf9ee;border:3px solid #d8c9a3;border-radius:6px;padding:18px 18px 14px;z-index:1;transform:translate(-50%,30px) scale(.92);opacity:0;pointer-events:none;transition:transform .85s cubic-bezier(.2,.7,.3,1.05), opacity .3s;box-shadow:0 12px 30px rgba(4,32,46,.45);color:#5a4a32;font-size:13px;line-height:1.9;text-align:center;}
  #envWrap.opened .envLetter{transform:translate(-50%,-255px) scale(1);opacity:1;pointer-events:auto;z-index:3;}
  .envBtns .btn{
    display:inline-block;border:2px solid #8a5a28;color:#fff;background:#a8643c;
    padding:7px 22px;font-size:13px;letter-spacing:.2em;cursor:pointer;border-radius:4px;
    font-family:inherit;box-shadow:2px 2px 0 #5a4a32;transition:all .15s;
  }
  .envBtns .btn:hover{background:#8a5a28;transform:translate(1px,1px);box-shadow:1px 1px 0 #5a4a32;}
  .envB{color:#4a3a26;}
  .envB b{color:#8a4a1e;}
  .envT{font-size:14px;letter-spacing:.25em;color:#a8643c;margin-bottom:10px;}
  .envB b{color:#8a5a28;font-weight:normal;}
  .envBtns{margin-top:14px;display:flex;gap:10px;justify-content:center;}
  .envBtns .btn{margin-top:0;}
</style>
</head>
<body>
<div class="wrap">

  <!-- 创建角色 -->
  <section id="screenCreate">
    <div class="titleZh">破浪手账</div>
    <div class="titleEn">SWIM LOG</div>
    <div class="wave"></div>
    <div class="field"><label>姓 名</label><input id="inName" maxlength="8" placeholder="给TA取个名字"></div>
    <div class="field"><label>性 别</label><div class="genderRow"><button class="gBtn on" data-g="f">女</button><button class="gBtn" data-g="m">男</button></div></div>
    <div class="field"><label>发 型</label><div class="pickRow" id="pickHair"></div></div>
    <div class="field"><label>泳 衣</label><div class="pickRow" id="pickSuit"></div></div>
    <div class="field"><label>肤 色</label><div class="pickRow" id="pickSkin"></div></div>
    <button class="btn" id="btnStart">翻 开 手 账</button>

function rollTraits(){
  const idx = [];
  while(idx.length<2){ const r=R(TRAITS.length); if(!idx.includes(r)) idx.push(r); }
  return idx.map(i=>TRAITS[i].id);
}

function newGame(name, age, gender){
  const traits = rollTraits();
  S = {
    name, age:clamp(age,8,40), traits, gender:gender||'f',
    diligence: clamp(48+R(24), 0, 100),
    health:    clamp(76+R(20), 0, 100),
    talent:    clamp(44+R(38), 0, 100),

  };

    if(t==='zl') S.diligence = clamp(S.diligence+15,0,100);
    if(t==='ty') S.talent    = clamp(S.talent+18,0,100);
    if(t==='wq') S.tech      = Math.max(8, S.tech-10);
  });
  addLog('翻开手账的第一页。'+S.name+'，'+S.age+'岁，站在了泳池边。');

  if(has('nl') && S.fatigue>=70) base *= 1.15;
  return base;
}
function affBuff(){
  let a = 0;
  S.friends.forEach(f=>{ a += Math.floor((f.aff||0)/3) * ((f.stage||0)>=3 ? 2 : 1); });

}
function growthMult(){
  let g = 1;
  if(has('wq')) g *= 1.2;
  if(has('dl')) g *= 1.08;
  g *= 1 + Math.min(S.friends.length,10) * (has('sj')?0.003:0.002);
  g *= 1 + affBuff();
  g *= S.globalMult||1;
  return g;
}

function restMult(){

function sickChance(){

/* 主课训练：节奏小游戏结算后计效果（踩点越准，倍率越高） */
function finishMain(mult){
    sfx('splash');
    laneSwim();
    S.restStreak = 0;
    const dip = restDip();
    let gain = (10 + S.diligence*0.10 + R(6)) * mult * fatigueMult() * growthMult() * ageStage().gain * dip;
    if(S.buffDay===S.day) gain *= 1.5;
    let gelNote = '';
    if(S.coachUntil && S.day <= S.coachUntil) gain *= 1.2; // 好友陪练：聊天独有
    if(S.gelBuff){ gain *= 2; S.gelBuff=false; gelNote = '（能量胶生效，效果翻倍）'; }
    const cramp = tapeActive() ? false : Math.random() < 0.07;
    if(cramp){ gain *= 0.5; S.fatigue = clamp(S.fatigue+4, 0, 100); }
    gain = Math.max(1, Math.round(gain));
    const cap = Math.round(talentCap());
    const capped = gain > cap;
    gain = Math.min(gain, cap);
    S.trained += gain;
    S.fatigue = clamp(S.fatigue + Math.round(16 - S.diligence*0.05 + R(6)), 0, 100);
    S.tech += 0.3;
    addLog('主课训练'+(S.sick?'（带病上场）':'')+(cramp?'，中途小腿抽筋，量打了折':'')+gelNote+(dip<1?'（歇太久了，状态有点下滑）':'')+'，训练量 +'+gain+'。'+(capped?'（天赋所限，今天再练也吞不下更多了）':'')+fatigueNote());
}

/* 轻音效：WebAudio 合成，不加载任何文件 */
let _ac = null;
function sfx(t){
  if(S && S.volSfx != null && S.volSfx <= 0) return;
  try{
    _ac = _ac || new (window.AudioContext||window.webkitAudioContext)();
    if(_ac.state==='suspended') _ac.resume();
    const seq = t==='hit'  ? [[880,'square',.06]]
             : t==='miss' ? [[196,'sawtooth',.08]]
             : t==='open' ? [[392,'triangle',.07],[523,'triangle',.07]]
             : t==='win'  ? [[523,'square',.1],[659,'square',.1],[784,'square',.1],[1047,'square',.22]]
             : t==='page' ? [[523,'triangle',.05],[659,'triangle',.07]]
             : t==='splash'? [[340,'sine',.1],[190,'sine',.16]]
             : t==='gym'  ? [[150,'square',.07],[110,'square',.1]]
             : t==='rest' ? [[660,'sine',.1],[440,'sine',.14]]
             : t==='sparkle'? [[1319,'triangle',.05],[1568,'triangle',.05],[2093,'triangle',.09]]
             : t==='gift' ? [[784,'triangle',.07],[988,'triangle',.1]]
             : t==='coin' ? [[988,'square',.05],[1319,'square',.08]]
             : t==='chime'? [[659,'triangle',.08],[784,'triangle',.08],[1047,'triangle',.14]]
             : t==='sad'  ? [[330,'sine',.16],[247,'sine',.22]]
             : [];
    const vs = (S && S.volSfx!=null ? S.volSfx : 70) / 100;
    let dt = 0;
    seq.forEach(s=>{
      const o = _ac.createOscillator(), g = _ac.createGain();
      o.type = s[1]; o.frequency.value = s[0];
      g.gain.setValueAtTime(Math.max(.0001, .045*vs), _ac.currentTime+dt);
      g.gain.exponentialRampToValueAtTime(.0001, _ac.currentTime+dt+s[2]);
      o.connect(g); g.connect(_ac.destination);
      o.start(_ac.currentTime+dt); o.stop(_ac.currentTime+dt+s[2]+.02);
      dt += s[2]*.9;
    });
  }catch(e){}
}

/* ================= 背景音乐（WebAudio 合成循环） ================= */
let _bgm = null;
const BGM_PAT = [523,0,659,784,0,880,784,659, 523,0,440,523,587,0,659,0];
function volSfx(){ return (S && S.volSfx!=null) ? S.volSfx : 70; }
function volMusic(){ return (S && S.volMusic!=null) ? S.volMusic : 30; }
function bgmEnsure(){
  try{
    _ac = _ac || new (window.AudioContext||window.webkitAudioContext)();
    if(_ac.state==='suspended') _ac.resume();
    if(!_bgm){
      _bgm = {step:0, next:_ac.currentTime+.3};
      setInterval(bgmTick, 180);
    }
  }catch(e){}
}
function bgmTick(){
  try{
    if(!_ac || !_bgm) return;
    const v = volMusic()/100;
    const ahead = _ac.currentTime + .45;
    while(_bgm.next < ahead){
      const f = BGM_PAT[_bgm.step % 16];
      const t = _bgm.next;
      if(f && v > 0){
        const o = _ac.createOscillator(), g = _ac.createGain();
        o.type='triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t);
        g.gain.linearRampToValueAtTime(.055*v, t+.09);
        g.gain.exponentialRampToValueAtTime(.0001, t+.52);
        o.connect(g); g.connect(_ac.destination);
        o.start(t); o.stop(t+.58);
        if(_bgm.step % 8 === 0){
          const b = _ac.createOscillator(), bg = _ac.createGain();
          b.type='sine'; b.frequency.value = (_bgm.step % 16 === 0 ? 131 : 98);
          bg.gain.setValueAtTime(.0001, t);
          bg.gain.linearRampToValueAtTime(.07*v, t+.12);
          bg.gain.exponentialRampToValueAtTime(.0001, t+1.9);
          b.connect(bg); bg.connect(_ac.destination);
          b.start(t); b.stop(t+2);
        }
      }
      _bgm.step++;
      _bgm.next += .32;
    }
  }catch(e){}
}

  v = +v;
  if(k==='sfx') S.volSfx = v; else S.volMusic = v;

/* ================= 一天的推进 ================= */
function doAction(kind){
  if(!S || S.over) return;
  if(kind==='treat'){
    sfx('rest');
    S.sick=false; S.health=clamp(S.health+10,0,100);
    addLog('看了医生，吃了药，好好睡了一觉。');
  }
  else if(kind==='main'){
    finishMain(1); afterAction('main');
    return;
  }
  else if(kind==='tech'){
    sfx('gym');
    laneLand('tech');
    S.restStreak = 0;
    let g = (2 + R(2)) * growthMult() * (S.sick?0.4:fatigueMult()) * ageStage().tech * restDip();
    const cramp = tapeActive() ? false : Math.random() < 0.05;
    if(cramp){ g *= 0.5; S.fatigue = clamp(S.fatigue+4, 0, 100); }
    S.tech = Math.min(100, S.tech + Math.max(0.5, g));
    S.fatigue = clamp(S.fatigue + 9 + R(4), 0, 100);
    addLog('技术课，专抠转身和出发。'+(cramp?'（中途抽筋，效果减半）':''));
  }
  else if(kind==='strength'){
    sfx('gym');
    laneLand('gym');
    S.restStreak = 0;
    let g = (2 + R(2)) * growthMult() * (S.sick?0.4:fatigueMult()) * ageStage().strength * restDip();
    const cramp = tapeActive() ? false : Math.random() < 0.05;
    if(cramp){ g *= 0.5; S.fatigue = clamp(S.fatigue+4, 0, 100); }
    S.strength = Math.min(100, S.strength + Math.max(0.5, g));
    S.fatigue = clamp(S.fatigue + 12 + R(5), 0, 100);
    addLog('陆上力量课，撸铁撸到手抖。'+(cramp?'（中途抽筋，效果减半）':''));
  }
  else if(kind==='rest'){
    sfx('rest');
    laneLand('sleep');
    S.restStreak = (S.restStreak||0) + 1;
    S.fatigue = clamp(S.fatigue - Math.round(30*restMult()), 0, 100);
    S.health = clamp(S.health + 6, 0, 100);
    let note = S.sick ? '病还没好，今天在宿舍躺着。' : '休息日，睡到自然醒，身体轻了一点。';
    if(S.restStreak > 2) note += '（连着歇了'+S.restStreak+'次，肌肉有点松了——下次训练效果 -'+Math.round((1-restDip())*100)+'%）';
    addLog(note);
    if(S.sick){ S.sick=false; addLog('病好了。'); }
  }
  afterAction(kind);
}
function afterAction(kind){
  if(!S.sick && kind!=='treat'){
    if(Math.random() < sickChance()){
      S.sick = true;
      addLog('鼻子一酸——感冒了，明天可能练不动。', true);
    }
  }
  if(S.sick) S.health = clamp(S.health-3, 0, 100);
  if(S.sick) S.sickCount = (S.sickCount||0)+1;
  if(S.fatigue >= 100) S.burn100 = (S.burn100||0)+1;
  // 伤病预警：还差两次就提前终结生涯时提醒一次
  if(!S.warnedInjury && (S.burn100||0) >= 2){
    S.warnedInjury = true;
    sfx('sad');
    addLog('队医把你叫到一边：身体已经亮黄灯了。', true);
    showModal('身 体 警 报',
      '队医把你叫到一边，眉头拧着：「疲惫拉满 <b>100</b> 已经 <b>'+(S.burn100||0)+'</b> 次了。」<br><br>「再硬扛两次，身体会先于梦想撂下去的——<b>拉满 4 次，生涯就到这</b>。」<br><br><span style="font-size:12px;color:var(--ink-soft)">多休息，照顾好自己。生涯不能重来。</span>');
  }
  // 训练中偶尔拾到纪念品
  if(kind!=='treat' && Math.random() < 0.05){
    gainItem(pick(GENERICS));
  }

  S.day += TICK;
  S.chats = 0;
  // 生日与年龄增长（360 天 = 1 岁）
  const na = S.startAge + Math.floor((S.day-1)/360);
  if(na > S.age){ S.age = na; addLog('过了个生日——'+S.age+' 岁了，生日愿望是游得再快一点。', true); }
  checkEndings();
  careerEndCheck();
  // 40 岁：规则请你上岸
  if(!S.over && S.age >= 40){
    addLog('40 岁了。规则写着：该上岸了。', true);
    forceEnd('retire40');
    save(); render(); return;
  }
  // 队内考核：每 120 天一个周期，训练量不达标会被筛出队伍
  if(!S.assess) S.assess = { next: S.day + 120, last: S.trained, warned: false };
  if(!S.over && S.day >= S.assess.next) runAssessment();
  if(S.over){ save(); render(); return; }
  randomEvent();
  scheduleTrial();
  offerTrial();
  scheduleMeet();
  offerMeet();
  offerRetire();
  offerInternational();
  save();
  render();
}
/* ===== 队内考核：训练量不达标就淘汰 ===== */
function assessNeed(){
  const base = 100 + S.trialIdx*50;
  const agePen = S.age > 23 ? Math.round((S.age-23)*3) : 0;
  return Math.round((base + agePen) * (S.assess && S.assess.warned ? 1.15 : 1));
}
function runAssessment(){
  const got = S.trained - (S.assess.last==null ? 0 : S.assess.last);
  const need = assessNeed();
  S.assess.next = S.day + 120;
  S.assess.last = S.trained;
  if(got >= need){
    S.assess.warned = false;
    addLog('队内考核：本周期训练量 '+got+'（标准 '+need+'），达标。', true);
    toast('📋 队内考核通过 · 训练量 +'+got);
  } else if(!S.assess.warned){
    S.assess.warned = true;
    sfx('sad');
    addLog('队内考核未达标：训练量 '+got+'/'+need+'。教练给了最后一个周期。', true);
    showModal('队 内 考 核',
      '教练把考核表折起来，敲了敲你的柜门：<br><br>「这个周期训练量 <b>'+got+'</b>，标准是 <b>'+need+'</b>。」<br><br>「队里不养闲人。下一个周期再不达标，<b>你就得把柜子腾出来了</b>——而且标准还会提高两成。」<br><br><span style="font-size:12px;color:var(--ink-soft)">120 天后重新考核，累计训练量的涨幅是唯一标准。</span>');
  } else {
    addLog('连续两次队内考核不达标，你被筛出了队伍。', true);
    forceEnd('cut');
  }
  save();
}
/* 休息滑坡：连续休息后训练效果下降 */
function restDip(){
  const st = S.restStreak||0;
  if(st <= 2) return 1;
  return clamp(1 - 0.05*(st-2), 0.6, 1);
}
/* 肌效贴有效期 */
function tapeActive(){ return S.tapeUntil && S.day <= S.tapeUntil; }
function fatigueNote(){
  if(S.fatigue>=80) return '肩膀已经抬不起来了。';
  if(S.fatigue>=50) return '有点累了，注意节奏。';
  return '';
}

/* ================= 选拔赛：随机事件 + 弹框选择 ================= */
function scheduleTrial(){
  if(S.trialIdx < TRIALS.length && S.trained >= TRIALS[S.trialIdx] && S.trialDay===null){
    const wait = (1+R(3))*TICK;
    S.trialDay = S.day + wait;
    addLog('教练拍拍你的肩：最近练得不错，'+wait+'天后队里可能有一场选拔赛，随时准备。', true);
  }
}
function offerTrial(){
  if(S.trialDay !== null && S.day >= S.trialDay){
    const tier = MEET_TIERS[S.trialIdx];
    const p = trialChance();
    showModal('选 拔 赛',
      '今天队里临时宣布有一场选拔赛，通过的可以去打<b>「'+tier.name+'」</b>。<br><br>你的状态：疲惫 '+S.fatigue+(S.sick?' · 还在生病':'')+'<br>胜算大约 <b>'+Math.round(p*100)+'%</b>。<br><br>参不参加？',
      [
        {label:'跳下去', cb:runTrial},
        {label:'这次算了', cb:()=>{ S.trialDay = S.day + (3+R(4))*TICK; addLog('这次选拔没报名，教练说下次还有机会。'); }}
      ]);
  }
}
function trialChance(){
  let p = 0.32 + S.talent*0.004 + S.diligence*0.002 - S.fatigue*0.003 - (S.sick?0.15:0);
  return clamp(p, 0.08, 0.95);
}
function runTrial(){
  S.trialDay = null;
  const tier = MEET_TIERS[S.trialIdx];
  if(Math.random() < trialChance()){
    S.trialIdx++;
    showModal('选 拔 赛', S.name+'深吸一口气，跳了下去。<br><br>通过了<b>「'+tier.name+'」</b>的选拔！');
    addLog('选拔赛通过！获得'+tier.name+'参赛资格。', true);
    scheduleMeet();
  }else{
    const wait = (2+R(3))*TICK;
    S.trialDay = S.day + wait;
    showModal('选 拔 赛', S.name+'这一趟游得急了。<br><br>选拔没有通过，教练说：'+wait+'天后还有一次机会。');
    addLog('选拔赛未通过，'+wait+'天后可以再试。');
  }
  save();
}

function runMeet(tier, city){

/* 好友到场观赛：赛后一句台词，好感 +1 */
function fanLine(fan, rank){
  if(!fan) return '';
  const win = rank<=3;
  const say = win ? pick(['太帅了！我就说你可以！','看台第一排，看得手心都是汗！','拿了个牌！晚上请你吃饭！'])
                  : pick(['没关系，下次我还在。','你出发的样子已经很帅了。','走，吃点好的，别复盘了。']);
  fan.aff = Math.min(100,(fan.aff||0)+1); checkAffStage(fan);
  return '<br><br>看台上的<b>'+fan.name+'</b>喊得最大声：「'+say+'」<span style="font-size:12px;color:var(--ink-soft)">（好友到场，本场发挥 +5）</span>';
}
function runMeetResult(tier, city, hits, fan){
  const bonus = hits*2 - 8;
  const mine = S.talent*0.35 + S.tech*0.30 + S.strength*0.15 + S.diligence*0.10 + (100-S.fatigue)*0.10 + R(14)-7 + bonus
    + (S.suitBuff?12:0) + (fan?5:0) - (S.meetDistract?10:0);
  if(S.suitBuff){ S.suitBuff=false; addLog('竞速泳衣贴身如肤，划水都利落了几分。', true); }
  S.meetDistract = false; S.sponsorAsked = false;
  let better = 0;
  for(let i=0;i<7;i++){
    const rv = tier.rivals[0] + Math.random()*(tier.rivals[1]-tier.rivals[0]);
    if(rv > mine) better++;
  }
  const rank = better+1;
  if(rank===1){ S.goldStreak = (S.goldStreak||0)+1; } else { S.goldStreak = 0; }
  let medalTxt = '', rankTxt = '第'+rank+'名';
  if(rank===1){ S.medals.gold++; medalTxt='🥇 金牌'; sfx('win'); }
  else if(rank===2){ S.medals.silver++; medalTxt='🥈 银牌'; }
  else if(rank===3){ S.medals.bronze++; medalTxt='🥉 铜牌'; }
  S.meets.push({day:S.day, city, name:tier.name, rank});
  addLog(tier.name+'（'+city+'）：'+rankTxt+(medalTxt?'，'+medalTxt:'')+'。', true);
  // 比赛纪念品：明信片带城市邮戳，其余通用品
  if(Math.random() < 0.30) gainItem('card', city);
  else if(Math.random() < 0.22) gainItem(pick(GENERICS));
  // 老朋友寄明信片
  palPostcard();
  let extra = '';
  // 级别越高，认识的人越多
  const meetChances = S.trialIdx>=3 ? [0.65,0.5,0.4] : (S.trialIdx>=2 ? [0.65,0.45] : [0.65]);
  meetChances.forEach(ch=>{ if(Math.random() < ch){ const e = makeFriend(city); if(e) extra += e; } });
  const bonusTxt = '<span style="font-size:12px;color:var(--ink-soft)">（划水节奏 '+hits+'/8，发挥'+(bonus>=0?'+':'')+bonus+'）</span>';
  showModal(tier.name, city+'的泳池，八条泳道。<br><br>'+bonusTxt+'<br><br>'+S.name+'拿到了<b>'+rankTxt+'</b>'+(medalTxt?'，'+medalTxt:'')+'。'+fanLine(fan, rank)+extra);
  checkEndings();
  scheduleTrialIfNeeded();
  if(S.trialIdx >= 1){
    const wait = 40+R(40);
    S.meetDay = S.day + wait;
    addLog('下一场比赛定在'+wait+'天后。');
  }
  save();
}
function makeFriend(city, intl){
  let cand = S.roster.map((p,i)=>({p,i})).filter(o=>!S.metIdx.includes(o.i) && o.p.r===city);
  if(!cand.length) cand = S.roster.map((p,i)=>({p,i})).filter(o=>!S.metIdx.includes(o.i));
  if(!cand.length) return '';
  const pickd = pick(cand);
  S.metIdx.push(pickd.i);

    ()=>runIntMeet(meet, loc.city, loc.country, rivals),

function runIntMeet(meet, city, country, rivals){
  rivals = rivals || INT_RIVALS[meet] || [100,114];
  const closeFs = S.friends.filter(f=>(f.stage||0)>=3);
  const fan = closeFs.length ? pick(closeFs) : ((S.friends.length && Math.random()<0.5) ? pick(S.friends) : null);
  openSwimGame(hits=>runIntMeetResult(meet, city, country, rivals, hits, fan), {rounds:8});
}
function runIntMeetResult(meet, city, country, rivals, hits, fan){
  rivals = rivals || INT_RIVALS[meet] || [100,114];
  const bonus = hits*2 - 8;
  const mine = S.talent*0.35 + S.tech*0.30 + S.strength*0.15 + S.diligence*0.10 + (100-S.fatigue)*0.10 + R(14)-7 + bonus
    + (S.suitBuff?12:0) + (fan?5:0) - (S.meetDistract?10:0);
  if(S.suitBuff){ S.suitBuff=false; addLog('竞速泳衣贴身如肤，划水都利落了几分。', true); }
  S.meetDistract = false;
  let better = 0;
  for(let i=0;i<7;i++){
    const rv = rivals[0] + Math.random()*(rivals[1]-rivals[0]);
    if(rv > mine) better++;
  }
  const rank = better+1;
  if(rank===1){ S.goldStreak = (S.goldStreak||0)+1; } else { S.goldStreak = 0; }
  let medalTxt = '', rankTxt = '第'+rank+'名';
  if(rank===1){ S.medals.gold++; medalTxt='🥇 金牌'; sfx('win'); }
  else if(rank===2){ S.medals.silver++; medalTxt='🥈 银牌'; }
  else if(rank===3){ S.medals.bronze++; medalTxt='🥉 铜牌'; }
  S.meets.push({day:S.day, city, name:meet+' · 国际', rank});
  addLog(meet+'（'+city+'）：'+rankTxt+(medalTxt?'，'+medalTxt:'')+'。', true);
  if(Math.random() < 0.40) gainItem('card', city, country);
  else if(Math.random() < 0.30) gainItem(pick(GENERICS));
  palPostcard();
  checkEndings();

  let extra = '';
  [0.8, 0.6, 0.4].forEach(ch=>{ if(Math.random() < ch){ const e = makeFriend(city, true); if(e) extra += e; } });
  const bonusTxt = '<span style="font-size:12px;color:var(--ink-soft)">（划水节奏 '+hits+'/8，发挥'+(bonus>=0?'+':'')+bonus+'）</span>';
  showModal(meet, city+'的水深比家里深。<br><br>'+bonusTxt+'<br><br>'+S.name+'拿到了<b>'+rankTxt+'</b>'+(medalTxt?'，'+medalTxt:'')+'。'+fanLine(fan, rank)+extra);
  if(meet==='奥运会' && rank===1){ forceEnd('champion'); }
  S.intCount = 0;
  save();
}

/* ================= 像素泳道小人 ================= */
const cv = document.createElement('canvas');
cv.id = 'laneCv'; cv.width = 480; cv.height = 72;
const cx = cv.getContext('2d');
let laneP = 0, laneTarget = 0;   // 0~1 泳道位置（运行时）
let laneMode = {type:'water', until:0};
const SCALE = 2;
function px(x,y,w,h,c){ cx.fillStyle=c; cx.fillRect(Math.round(x)*SCALE, Math.round(y)*SCALE, w*SCALE, h*SCALE); }
function attachLane(){
  const row = document.getElementById('laneRow');
  if(row && cv.parentElement !== row){ row.innerHTML=''; row.appendChild(cv); }
}
function skinC(){ return (S && S.skinColor) || '#ffd9b3'; }
function suitC(){ return (S && S.suitColor) || (S && S.gender==='m' ? '#5aa8cc' : '#e8798a'); }
function hairC(){ return (S && S.gender==='m') ? '#3a2a20' : '#7a4a2b'; }
function hairStyle(){ return S ? (S.hairstyle || (S.gender==='m' ? 'short' : 'long')) : 'long'; }

/* 俯视自由泳，面向右；frame: 0/1 换臂 */
function drawSwim(frame, x, y){
  const skin = skinC(), suit = suitC(), hair = hairC();
  // 打腿水花
  const ks = frame===0 ? 1 : -1;
  px(x-12, y-5+ks, 3, 2, 'rgba(255,255,255,.55)');
  px(x-12, y+3-ks, 3, 2, 'rgba(255,255,255,.55)');
  // 身体（泳衣）
  px(x-8, y-5, 16, 10, suit);
  px(x-9, y-3, 18, 6, suit);
  // 头 + 头发
  px(x+8, y-5, 10, 10, skin);
  const st = hairStyle();
  if(st==='long'){ px(x+8, y-6, 10, 12, hair); px(x+13, y-4, 5, 8, skin); px(x-4, y-3, 12, 6, hair); }
  else if(st==='pony'){ px(x+8, y-6, 10, 6, hair); px(x-2, y-4, 7, 4, hair); px(x-6, y-2, 4, 6, hair); }
  else { px(x+8, y-6, 10, 6, hair); px(x+8, y-6, 4, 12, hair); }
  // 划水臂
  if(frame===0){ px(x+17, y-2, 15, 4, skin); px(x-20, y-2, 12, 4, skin); px(x+32, y-3, 3, 6, 'rgba(255,255,255,.75)'); }
  else { px(x+10, y-8, 12, 4, skin); px(x-22, y+2, 14, 4, skin); px(x-22, y+4, 3, 5, 'rgba(255,255,255,.55)'); }
}
/* 站姿正面（撸铁 / 陆上动作共用）；y = 脚底基线；Q版短身比例；pose: 0 抱铃/垂臂， 1 平举， 2 举过头顶 */
function drawStand(pose, x, y, withBar){
  const skin = skinC(), suit = suitC(), hair = hairC();
  // 头发（后层）
  px(x, y-14, 10, 3, hair);
  const st = hairStyle();
  if(st==='long'){ px(x-1, y-12, 3, 7, hair); px(x+8, y-12, 3, 7, hair); }
  else if(st==='pony'){ px(x+11, y-13, 3, 8, hair); px(x+13, y-6, 2, 4, hair); }
  else { px(x-1, y-14, 12, 5, hair); }
  // 头
  px(x, y-13, 10, 8, skin);
  if(S && S.gender==='m'){ px(x-1, y-14, 12, 5, hair); }
  // 身体
  px(x-4, y-5, 18, 7, suit);
  // 腿 + 鞋
  px(x-2, y+2, 6, 5, skin); px(x+8, y+2, 6, 5, skin);
  px(x-3, y+7, 8, 3, suit); px(x+7, y+7, 8, 3, suit);
  // 杠铃 / 手臂
  if(withBar){
    const barY = pose===0 ? y-8 : (pose===1 ? y-11 : y-14);
    px(x-13, barY, 36, 3, '#cfd8dc');
    px(x-17, barY-3, 5, 9, '#37474f'); px(x+22, barY-3, 5, 9, '#37474f');
    px(x-13, barY-1, 4, 5, skin); px(x+19, barY-1, 4, 5, skin);
  }else{
    if(pose===0){ px(x-8, y-5, 4, 8, skin); px(x+14, y-5, 4, 8, skin); }
    else if(pose===1){ px(x-18, y-8, 12, 4, skin); px(x+16, y-8, 12, 4, skin); }
    else { px(x-12, y-15, 4, 9, skin); px(x+18, y-15, 4, 9, skin); }
  }
}
function drawLane(ts){
  cx.clearRect(0, 0, 480, 56);
  cx.imageSmoothingEnabled = false;
  const inGym = laneMode.type==='gym' && ts < laneMode.until;
  const inTech = laneMode.type==='tech' && ts < laneMode.until;
  const inSleep = laneMode.type==='sleep' && ts < laneMode.until;
  if(inSleep){ drawSleep(ts); return; }
  if(inGym || inTech){
    // 陆上：地板 + 哑铃架剪影
    cx.fillStyle='rgba(8,30,44,.45)'; cx.fillRect(0,0,480,72);
    px(0, 31, 240, 1, 'rgba(255,255,255,.12)');
    px(24, 14, 3, 16, 'rgba(255,255,255,.14)'); px(24, 12, 10, 3, 'rgba(255,255,255,.14)');
    px(170, 16, 3, 14, 'rgba(255,255,255,.10)'); px(170, 14, 9, 3, 'rgba(255,255,255,.10)');
    const pose = Math.floor(ts/300) % 3;
    if(inGym) drawStand(pose, 110, 27, true);
    else drawStand(pose, 110, 27, false);
    cx.fillStyle='rgba(242,251,253,.55)';
    cx.font='12px sans-serif';
    cx.fillText(inGym ? '陆上力量 · 撸铁中' : '陆上技术 · 动作练习', 300, 26);
    return;
  }
  // 水面泳道
  cx.fillStyle='rgba(180,230,244,.10)'; cx.fillRect(0,0,480,72);
  // 泳道线（虚线，中线）
  cx.fillStyle='rgba(255,255,255,.30)';
  for(let x=6; x<468; x+=18){ cx.fillRect(x, 35, 9, 2); }
  // 分道线绳点
  cx.fillStyle='rgba(255,255,255,.22)';
  for(let x=0; x<480; x+=12){ cx.fillRect(x, 2, 5, 3); cx.fillRect(x, 67, 5, 3); }
  // 位置趋近
  laneP += (laneTarget - laneP) * 0.06;
  const sx = 26 + laneP * 176;
  const bob = Math.sin(ts/240) * 1.2;
  const strokeFast = Math.abs(laneTarget - laneP) > 0.01;
  const frame = Math.floor(ts / (strokeFast ? 140 : 500)) % 2;
  drawSwim(frame, sx, 18 + bob);
  // 水泡
  const bx = (sx - 40 - (ts/40)%60 + 480) % 480;
  cx.fillStyle='rgba(255,255,255,.25)';
  cx.fillRect(bx, 52, 3, 3); cx.fillRect(bx+14, 58, 2, 2);
}
function laneLoop(ts){
  if(cv.isConnected) drawLane(ts);
  requestAnimationFrame(laneLoop);
}
requestAnimationFrame(laneLoop);
function laneSwim(){
  let nt = laneTarget + 0.18;
  if(nt >= 1){ S.laps = (S.laps||0) + 1; nt = 0; laneP = 0; toast('游完一整趟，转身！第 '+S.laps+' 趟'); }
  laneTarget = nt;
  S.swimX = nt;
}
function laneLand(type){
  laneMode = {type, until: performance.now() + (type==='sleep' ? 3200 : 2600)};
}
/* 睡觉动画：夜晚、躺着的小人、Zzz */
function drawSleep(ts){
  cx.fillStyle='rgba(5,22,38,.55)'; cx.fillRect(0,0,480,72);
  cx.imageSmoothingEnabled = false;
  // 月亮 + 闪爈的星星
  px(424, 10, 6, 6, 'rgba(255,236,180,.95)'); px(420, 13, 14, 4, 'rgba(255,236,180,.95)');
  const stars = [[40,12],[92,24],[160,10],[248,18],[330,14],[378,28]];
  cx.fillStyle='rgba(255,255,255,.6)';
  stars.forEach((s,i)=>{ if(Math.floor(ts/600)%2 === i%2) cx.fillRect(s[0], s[1], 3, 3); });
  // 床垫
  px(78, 42, 122, 8, 'rgba(255,255,255,.16)');
  px(78, 40, 10, 10, 'rgba(255,255,255,.22)');
  // 躺着的小人（头在右，闭眼）
  const skin = skinC(), suit = suitC(), hair = hairC();
  px(106, 36, 44, 8, suit);
  px(98, 37, 8, 6, suit);
  px(150, 34, 14, 9, skin);
  const st = hairStyle();
  if(st==='long'){ px(150, 32, 14, 4, hair); px(162, 32, 4, 11, hair); px(108, 32, 40, 4, hair); }
  else if(st==='pony'){ px(150, 32, 14, 4, hair); px(144, 33, 6, 8, hair); }
  else { px(150, 32, 14, 4, hair); }
  px(122, 32, 10, 4, skin);
  // Zzz 飘动
  const zoff = Math.floor(ts/350)%3;
  cx.fillStyle='rgba(242,251,253,.85)';
  cx.font='11px sans-serif'; cx.fillText('z', 168, 30 - zoff*5);

  cx.fillStyle='rgba(242,251,253,.5)';
  cx.font='12px sans-serif'; cx.fillText('休息中 · 恢复体力', 290, 26);
}

/* ================= 好友聊天（微信风） / 送礼 ================= */
function chatWith(i){
  if((S.chats||0) >= chatLimit()){ toast('今天聊得够多啦，明天再找TA'); return; }
  const f = S.friends[i];
  const AVC = ['#e8a0a8','#8fbcd9','#9ecf9a','#c9a8d9','#e8c08a','#a0c4e8'];
  const favC = AVC[i % AVC.length];
  const topic = pick(CHAT_TOPICS);
  const opts = topic.opts.slice().sort(()=>Math.random()-0.5);
  const msgs = [];
  function bub(av, avc, me, text){
    return '<div class="wxRow'+(me?' me':'')+'"><div class="wxAv" style="background:'+avc+'">'+av+'</div><div class="bub">'+text+'</div></div>';
  }
  function draw(){
    const ended = st.phase === 'done';
    const foot = (ended && st.lastD !== undefined)
      ? '<div style="text-align:center;font-size:11px;color:#8a8a8a;margin-top:8px">好感度 '+(st.lastD>0?'+':'')+(st.lastD===0?'±0':st.lastD)+' · 当前 '+f.aff+'</div>' : '';
    let optsHtml;
    if(ended){
      optsHtml = '<button class="wxEnd" onclick="closeModal()">收起聊天</button>';
    } else {
      optsHtml = '<div class="wxFan">' + opts.map((o,k)=>{
        const rot = (k - (opts.length-1)/2) * 16;
        const isPick = st.picked === k && (st.phase === 'lift' || st.phase === 'flip');
        let cls = 'wxCard';
        if(isPick){ cls += (st.phase === 'flip' ? ' open' : ' chosen'); }
        else if(st.phase === 'lift' || st.phase === 'flip'){ cls += ' gone'; }
        const dt = o[1] > 0 ? '+'+o[1] : (o[1] === 0 ? '±0' : ''+o[1]);
        const dtColor = o[1] > 0 ? '#ffe28a' : (o[1] === 0 ? '#dfeaf2' : '#ffb3a0');
        return '<button class="'+cls+'" style="--rot:'+rot+'deg; z-index:'+(10+k)+'" onclick="wxReply('+i+','+k+')"><span class="back">✦<small>抽 一 张</small></span><span class="front">'+o[0]+'<span class="delta" style="color:'+dtColor+'">好感 '+dt+'</span></span></button>';
      }).join('') + '</div>';
    }
    showModal('与 '+f.name+' 聊天',
      '<div class="wxChat"><div class="wxMsgs">'+msgs.join('')+'</div><div class="wxOpts">'+optsHtml+'</div></div>'+foot, []);
  }
  const st = window._wxState = { i, f, favC, msgs, bub, draw, opts, phase:null, picked:-1, lastD:undefined };
  msgs.push(bub(f.name.charAt(0), favC, false, topic.open.replace(/\{city\}/g, f.city).replace(/\{name\}/g, f.name)));
  draw();
}
function wxReply(i, k){
  const st = window._wxState;
  if(!st || st.i !== i || st.phase) return;
  st.phase = 'lift'; st.picked = k;
  sfx('open');
  st.draw();
  setTimeout(()=>{
    if(window._wxState !== st) return;
    st.phase = 'flip';
    st.draw();
  }, 550);
  setTimeout(()=>{
    if(window._wxState !== st) return;
    const f = st.f;
    const pair = st.opts[k];

function viewPhoto(place, title){
  const ph = photoOf(place);
  if(!ph || (!ph.pix && !ph.url)){ showModal(title, '<div class="pcBig">🏙️</div><div class="pcCap">'+(ph?ph.name:place)+'的风景，等你亲自去看</div>'); return; }
  if(ph.pix){
    const fb = ph.url ? imgUrl(ph.url) : '';
    showModal(title, '<img class="pcImg pixImg" src="'+ph.pix+'" data-fallback="'+fb+'" onerror="pixFail(this)"><div class="pcCap">'+ph.name+'</div>');
    return;
  }
  const m = ph.url.match(/\/thumb\/(.+)\/(\d+)px-/);
  const path = m ? m[1] : '';
  const cur = m ? m[2]+'px' : '';
  const alts = ['500px','960px','330px','1280px'].filter(w=>w!==cur).join(',');
  showModal(title, '<img class="pcImg" src="'+imgUrl(ph.url)+'" data-path="'+path+'" data-alts="'+alts+'" onerror="pcImgFail(this)"><div class="pcCap">'+ph.name+'</div>');
}
function pixFail(el){
  const fb = el.dataset.fallback;
  if(fb){
    el.dataset.fallback = '';
    el.classList.remove('pixImg');
    const m = fb.match(/\/thumb\/(.+)\/(\d+)px-/);
    el.dataset.path = m ? m[1] : '';
    el.dataset.alts = m ? ['500px','960px','330px','1280px'].filter(w=>w!==(m[2]+'px')).join(',') : '';
    el.onerror = function(){ pcImgFail(el); };
    el.src = fb;
    return;
  }
  const d = document.createElement('div');
  d.className = 'pcBig'; d.textContent = '🏙️';
  el.replaceWith(d);
}
function pcImgFail(el){
  const alts = (el.dataset.alts||'').split(',').filter(Boolean);
  const path = el.dataset.path||'';
  if(path && alts.length){
    const next = alts.shift();
    el.dataset.alts = alts.join(',');
    el.src = 'https://wsrv.nl/?url=upload.wikimedia.org/wikipedia/commons/thumb/' + path + '/' + next + '-' + path.split('/').pop();
    return;
  }
  const d = document.createElement('div');
  d.className = 'pcBig'; d.textContent = '🏙️';
  el.replaceWith(d);
}

function renderDex(){
  if(!$('dexList')) return;
  const cnCnt = CITIES.filter(c=>S.dex.cn[c]).length;
  const intlCnt = INT_LOCS.filter(l=>S.dex.intl[l.country]).length;
  const cn = CITIES.map(c=>'<div class="dexCell'+(S.dex.cn[c]?' on':'')+'" onclick="tapDex(\'cn\',\''+c+'\')"><div class="di">'+(S.dex.cn[c]?'🏙️':'·')+'</div><div class="dn">'+c+'</div></div>').join('');
  const intl = INT_LOCS.map(l=>'<div class="dexCell'+(S.dex.intl[l.country]?' on':'')+'" onclick="tapDex(\'intl\',\''+l.country+'\')"><div class="di">'+(S.dex.intl[l.country]?'🌍':'·')+'</div><div class="dn">'+l.country+'</div></div>').join('');
  $('dexList').innerHTML =
    '<div class="dexTitle">国 内 城 市 · '+cnCnt+'/'+CITIES.length+'</div><div class="dexGrid">'+cn+'</div>'+
    '<div class="dexTitle">国 际 国 家 · '+intlCnt+'/'+INT_LOCS.length+'</div><div class="dexGrid">'+intl+'</div>'+
    '<div class="dexReward">'+
    (S.rewards.cn ? '✅ 山河邮戳已达成 · 勤奋 +5 · 训练量 +100' : '🔒 集齐国内 '+CITIES.length+' 城明信片 → 「山河邮戳」奖励') +
    (S.rewards.intl ? '<br>✅ 五洲行者已达成 · 天赋 +3 · 永久训练效果 +5%' : '<br>🔒 集齐 '+INT_LOCS.length+' 国纪念品 → 「五洲行者」奖励') +
    '</div>';
}
function trialProgress(){
  if(S.trialIdx >= TRIALS.length) return 100;
  const lo = S.trialIdx===0 ? 0 : TRIALS[S.trialIdx-1];
  const hi = TRIALS[S.trialIdx];
  return clamp((S.trained-lo)/(hi-lo)*100, 0, 100);
}
function trialLabel(){
  if(S.trialIdx >= TRIALS.length) return 'MAX';
  return S.trained+'/'+TRIALS[S.trialIdx];
}

/* ================= 弹层 / 杂项 ================= */
function showModal(title, body, buttons){
  $('mdTitle').textContent = title;
  $('mdBody').innerHTML = body;
  const box = $('mdBtns');
  box.innerHTML = '';
  const bs = buttons || [{label:'知道了'}];
  bs.forEach(b=>{
    const el = document.createElement('button');
    el.className = 'btn small';
    el.textContent = b.label;
    el.onclick = () => { sfx('tap'); $('modal').classList.remove('on'); if(b.cb) b.cb(); if(S && !S.over) render(); flushMilestones(); };
    box.appendChild(el);
  });
  $('modal').classList.add('on');
}
function toast(t){
  const el = $('toast');
  el.textContent = t; el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'), 1800);
}
function resetGame(){
  localStorage.removeItem(SAVE_KEY);
  S = null;
  $('modal').classList.remove('on');
  $('setModal').classList.remove('on');
  $('screenGame').style.display='none';
  $('btnSetting').style.display='none';
  $('screenCreate').style.display='block';
}
document.querySelectorAll('.gBtn').forEach(el=>{
  el.onclick = ()=>{
    document.querySelectorAll('.gBtn').forEach(x=>x.classList.remove('on'));
    el.classList.add('on');
    _look.hair = el.dataset.g==='m' ? 'short' : 'long';
    buildLookPickers();
  };
});

/* 捏人：发型 / 泳衣颜色 / 肤色 */
const HAIR_OPTS = [{id:'short',t:'短发'},{id:'long',t:'长发'},{id:'pony',t:'马尾'}];
const SUIT_COLORS = ['#e8798a','#5aa8cc','#e6b45a','#8bc34a','#b58ad6','#d65a5a','#4f9e58','#e8e2d0'];
const SKIN_COLORS = ['#ffd9b3','#f8d5b0','#f2c19a','#e0a87e','#c98a5e'];
let _look = {hair:'long', suit:SUIT_COLORS[0], skin:SKIN_COLORS[0]};
function buildLookPickers(){
  const hr = $('pickHair'); hr.innerHTML = '';
  HAIR_OPTS.forEach(o=>{ const b = document.createElement('button'); b.className = 'pBtn'+(_look.hair===o.id?' on':''); b.textContent = o.t; b.onclick = ()=>{ _look.hair = o.id; buildLookPickers(); }; hr.appendChild(b); });
  const st = $('pickSuit'); st.innerHTML = '';
  SUIT_COLORS.forEach(c=>{ const b = document.createElement('button'); b.className = 'swatch'+(_look.suit===c?' on':''); b.style.background = c; b.onclick = ()=>{ _look.suit = c; buildLookPickers(); }; st.appendChild(b); });
  const sk = $('pickSkin'); sk.innerHTML = '';
  SKIN_COLORS.forEach(c=>{ const b = document.createElement('button'); b.className = 'swatch'+(_look.skin===c?' on':''); b.style.background = c; b.onclick = ()=>{ _look.skin = c; buildLookPickers(); }; sk.appendChild(b); });
}
buildLookPickers();
document.querySelectorAll('.tab').forEach(el=>{
  el.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
    el.classList.add('on');
    $('panel-'+el.dataset.tab).classList.add('on');
  };
});
$('btnStart').onclick = ()=>{
  sfx('page');
  const name = $('inName').value.trim();
  const age = 8; // 默认从 8 岁起步，不再自选
  const gender = document.querySelector('.gBtn.on').dataset.g;
  if(!name){ toast('先给TA取个名字吧'); return; }
  newGame(name, age, gender);
  render();
  const d0 = S.traits.map(t=>TRAITS.find(x=>x.id===t));
  const stg = ageStage();
  showModal('开 营 日', '「'+name+'」入队了。<br><br>随机生成的性格特征：<br><b>'+d0[0].name+'</b> · '+d0[0].desc+'<br><b>'+d0[1].name+'</b> · '+d0[1].desc+'<br><br>年龄阶段：<b>'+stg.name+'</b> · '+stg.note);
};
/* 有进行中的手账时，开新档先确认，防止误覆盖 */
const _origBtnStart = $('btnStart').onclick;
$('btnStart').onclick = function(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(raw && !window._forceNew){
    let o = null; try{ o = JSON.parse(raw); }catch(e){}
    if(o && !o.over){
      showModal('翻 新 手 账',
        '有一本进行中的手账：<b>'+o.name+'</b>（第 '+o.day+' 天 · '+Math.ceil(o.day/30)+' 个月）。<br><br>翻开新手账会<b>覆盖</b>它，而且找不回来。',
        [{label:'继 续 旧 手 账', cb:()=>{ sfx('page'); resumeGame(); }},
         {label:'仍 要 开 新 的', cb:()=>{ window._forceNew = true; $('btnStart').click(); }}]);
      return;
    }
  }
  window._forceNew = false;
  _origBtnStart.call(this);
};
$('btnReset').onclick = ()=>{
  if(confirm('确定要重新开始吗？当前手账会被撕掉。')) resetGame();
};
$('btnHistory').onclick = ()=>{ sfx('page'); showHistory(); };
$('btnSetting').onclick = ()=>{ sfx('tap'); openSettings(); };
$('btnRenameOk').onclick = ()=>{ sfx('tap'); doRename(); };
$('btnSetClose').onclick = ()=>{ sfx('page'); $('setModal').classList.remove('on'); };
$('btnSaveNow').onclick = ()=>{
  save();
  S.lastSave = Date.now();
  save();
  sfx('chime');
  toast('进度已保存 ✓（'+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'）');
};
$('btnHelp').onclick = ()=>{ sfx('tap'); showHelp(); };
$('btnHome').onclick = ()=>{ sfx('page'); backHome(); };
$('btnResume').onclick = ()=>{ sfx('page'); resumeGame(); };

/* 回到首页：自动存档，回到开局页（存档保留，可「继续手账」回来） */
function backHome(){
  save(); S.lastSave = Date.now(); save();
  $('setModal').classList.remove('on');
  $('modal').classList.remove('on');
  $('screenGame').style.display='none';
  $('btnSetting').style.display='none';
  $('screenCreate').style.display='block';
  $('btnResume').style.display='';
  toast('已存档 ✓');
}
function resumeGame(){
  if(!load()){ toast('没有找到存档'); return; }
  $('modal').classList.remove('on');
  $('setModal').classList.remove('on');
  $('screenCreate').style.display='none';
  $('screenGame').style.display='';
  $('btnSetting').style.display='';
  laneP = S.swimX || 0; laneTarget = laneP;
  render();
  if(S.over) showEndSummary();
}
/* 已结束的存档再次打开时，只重演结算页，不再触发新结局 */
function showEndSummary(){
  const m = S.medals;
  const lastEnd = S.log ? S.log.filter(l=>l.t.indexOf('生涯结束') > -1)[0] : null;
  _mq.push({t:'手 账 之 后',
    b:(lastEnd ? '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px">'+lastEnd.t+'</div>' : '')
      +'泳池生涯 · '+Math.ceil(S.day/30)+' 个月<br>累计训练量 '+S.trained+'<br>奖牌 🥇'+m.gold+' 🥈'+m.silver+' 🥉'+m.bronze+'<br>朋友 '+S.friends.length+' 人<br>成就 '+ACH.filter(a=>S.ach&&S.ach[a.id]).length+' / '+ACH.length+'<br><br>这本手账已经合上了。',
    btns:[{label:'重新翻开一本手账', cb:resetGame}]});
  flushMilestones();
}
/* 玩法说明：分类速查 */

  const L = a => a.map(x=>'· '+x).join('<br>');

      '国际更高一档：亚运会 < 世界杯 < 世锦赛 < 奥运会（最高）',
      '名次 = 天赋35% + 技巧30% + 力量15% + 勤奋10% + 状态10%，再加划水发挥（命中×2−8）、好友加油 +5、装备加成，随机只占 ±7',
      '对手 7 人按赛事级别出分，级别越高越难爆冷'

      '好感 50 老朋友：寄明信片、回礼、约你陪练（30 天训练 +20%）',
      '好感 80 知己：点拨技术细节（天赋 +1）、送礼好感 +4、聊天上限 +1',
      '好感 100 并肩的人：你的每场比赛必到场，发挥 +5',

    ])) +

    H('🩹 身体', L([

      '生病会掉健康，休息能治好；肌效贴 30 天内不抽筋',
      '恢复饮料 -25 疲惫，电解质片 +10 健康'
    ])) +
    H('🎂 成长与年龄', L([
      '360 天 = 1 岁，每年生日涨 1 岁',
      '童子班水感学得快 → 青苗期 → 黄金期 → 成熟期 → 老将（靠经验吃饭）',
      '40 岁规则会让你上岸——结局「四十岁的浪」'
    ])) +
    H('🏁 结局与成就', L([
      '结局只有 5 个，全部会结束生涯：奥运夺冠 / 转行 / 伤病退役 / 队内淘汰 / 40 岁退役',
      '成就不结束生涯，共 7 项：32 岁仍在坚持 / 累计 15 金 / 连胜 10 场 / 图鉴全收集 / 5 位好友满好感 / 结识所有人 / 累计 30 场比赛',
      '成就进度在收藏栏「🏆 成就」页随时可查；合上的手账在首页「回看手账」里'
    ]))
  );
}

/* ================= 启动 ================= */
if(load()){
  laneP = S.swimX || 0; laneTarget = laneP;
  render();
  if(S.over){ showEndSummary(); }
}
if(localStorage.getItem(SAVE_KEY)){ $('btnResume').style.display=''; }
</script>
