<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>破浪手账 · Swim Log</title>
<style>
  :root{
    --ink:#f2fbfd;
    --ink-soft:rgba(242,251,253,.62);
    --accent:#aee5f2;
    --line:rgba(255,255,255,.22);
    --glass:rgba(255,255,255,.10);
    --glass-h:rgba(255,255,255,.18);
    --warn:#ffc2ae;
    --good:#a8e6cf;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:#0d4a6a url('assets/pool-bg-pixel.png?v=1') center/cover fixed no-repeat;
    color:var(--ink);
    line-height:1.8;
    overflow-x:hidden;
  }
  /* 压暗 veil，保证文字可读 */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:linear-gradient(180deg, rgba(6,38,56,.28) 0%, rgba(5,32,48,.44) 55%, rgba(3,24,38,.58) 100%);
  }
  .genderRow{display:flex;gap:14px;justify-content:center;margin-top:2px;}
  .gBtn{
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);
    font-family:inherit;font-size:14px;padding:8px 36px;border-radius:999px;cursor:pointer;
    transition:all .2s;letter-spacing:.25em;
  }
  .gBtn.on{border-color:var(--accent);color:var(--accent);background:rgba(174,229,242,.08);}
  #btnHistory{margin-top:14px;}
  .pickRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .pBtn{border:1px solid var(--line);background:transparent;color:var(--ink-soft);font-family:inherit;font-size:12px;padding:5px 16px;border-radius:999px;cursor:pointer;transition:all .2s;letter-spacing:.15em;}
  .pBtn.on{border-color:var(--accent);color:var(--accent);background:rgba(174,229,242,.08);}
  .swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.25);transition:all .15s;padding:0;}
  .swatch.on{border-color:var(--accent);transform:scale(1.18);box-shadow:0 0 0 2px rgba(174,229,242,.35);}
  .laneRow{margin:14px 0 12px;position:relative;}
  #laneTxt{position:absolute;right:6%;top:50%;transform:translateY(-50%);font-size:13px;letter-spacing:.14em;color:rgba(242,251,253,.75);pointer-events:none;white-space:nowrap;}
  #laneCv{display:block;width:100%;height:72px;image-rendering:pixelated;}
  .wrap{max-width:680px;margin:0 auto;padding:48px 24px 96px;position:relative;z-index:1;}

  /* ---------- 创建页 ---------- */
  #screenCreate{text-align:center;padding-top:9vh;}
  @font-face{font-family:'TitleHand';src:url('assets/title-hand.woff2') format('woff2');font-display:swap;}
  .titleZh{font-family:'TitleHand','STXingkai','华文行楷','Xingkai SC','KaiTi','楷体',serif;font-size:56px;letter-spacing:.12em;margin-left:.12em;font-weight:400;text-shadow:0 2px 22px rgba(13,74,106,.55);}
  .titleEn{font-size:13px;color:var(--ink-soft);letter-spacing:.28em;margin-top:8px;}
  .wave{margin:36px auto 40px;width:120px;height:2px;background:rgba(255,255,255,.4);}
  .field{margin:26px 0;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);letter-spacing:.2em;margin-bottom:8px;}
  .field input{
    width:220px;border:none;border-bottom:1px solid rgba(255,255,255,.4);background:transparent;
    padding:8px 4px;font-size:18px;color:var(--ink);text-align:center;outline:none;
    transition:border-color .25s;
  }
  .field input::placeholder{color:rgba(255,255,255,.38);}
  .field input:focus{border-color:var(--accent);}
  .btn{
    display:inline-block;border:1px solid rgba(255,255,255,.55);color:#f2fcff;background:transparent;
    padding:10px 34px;font-size:14px;letter-spacing:.25em;cursor:pointer;border-radius:999px;
    transition:all .25s;margin-top:34px;font-family:inherit;
  }
  .btn:hover{background:rgba(255,255,255,.16);}
  .btn.small{padding:6px 20px;font-size:12px;margin-top:0;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:14px;}
  .credit{font-size:11px;color:var(--ink-soft);margin-top:22px;letter-spacing:.08em;opacity:.85;}

  /* ---------- 游戏页 ---------- */
  #screenGame{display:none;}
  .head{text-align:center;margin-bottom:34px;}
  .head .name{font-size:22px;letter-spacing:.2em;text-shadow:0 2px 14px rgba(13,74,106,.4);}
  .head .sub{font-size:12px;color:var(--ink-soft);margin-top:4px;letter-spacing:.1em;}
  .traits{margin-top:12px;}
  .trait{
    display:inline-block;font-size:12px;color:var(--accent);
    border:1px solid rgba(174,229,242,.5);border-radius:999px;padding:2px 14px;margin:0 5px;
  }

  .btnSetting{
    position:fixed;top:14px;right:16px;z-index:60;display:none;
    width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.1);color:var(--paper);font-size:18px;cursor:pointer;
    backdrop-filter:blur(4px);transition:background .2s;
  }
  .btnSetting:hover{background:rgba(255,255,255,.22);}
  .setAvatarCv{display:block;margin:0 auto 6px;image-rendering:pixelated;width:96px;height:120px;}
  .setInfo{text-align:center;font-size:13px;margin-bottom:4px;}
  .setInfo .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .setDesc{margin:10px 0 2px;font-size:12px;color:var(--ink-soft);line-height:1.9;}
  .setRow{display:flex;align-items:center;margin:14px 0;font-size:13px;}
  .setRow .lb{width:60px;color:var(--ink-soft);flex-shrink:0;letter-spacing:.15em;}
  .setRow input[type=range]{flex:1;accent-color:var(--accent);margin:0 10px;}
  .setRow .vv{width:36px;text-align:right;font-size:12px;color:var(--ink-soft);}
  .renIn{
    flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
    border-radius:6px;padding:7px 10px;color:var(--paper);font-size:14px;font-family:inherit;letter-spacing:.1em;
  }
  .renIn::placeholder{color:rgba(255,255,255,.35);}

  .sec{margin:30px 0;}
  .secTitle{font-size:12px;color:var(--ink-soft);letter-spacing:.3em;margin-bottom:14px;}
  .barRow{display:flex;align-items:center;margin:10px 0;font-size:13px;}
  .barRow .lb{width:74px;color:var(--ink-soft);flex-shrink:0;}
  .bar{flex:1;height:6px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s;}
  .bar.fat i{background:var(--warn);}
  .bar.hp i{background:var(--good);}
  .barRow .num{width:52px;text-align:right;color:var(--ink-soft);font-size:12px;flex-shrink:0;}
  .badgeSick{
    display:inline-block;font-size:12px;color:var(--warn);border:1px solid rgba(255,194,174,.55);
    border-radius:999px;padding:1px 12px;margin-left:8px;
  }

  .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .act{
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;
    transition:all .25s;background:var(--glass);text-align:left;font-family:inherit;color:var(--ink);
  }
  .act:hover{border-color:rgba(255,255,255,.55);background:var(--glass-h);transform:translateY(-1px);}
  .act .t{font-size:14px;letter-spacing:.1em;}
  .act .d{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.6;}
  .act.wide{grid-column:1/-1;text-align:center;}
  .actTreat{border-color:rgba(255,194,174,.6);}
  .actTreat .t{color:var(--warn);}

  .tabs{display:flex;gap:26px;justify-content:center;margin:44px 0 18px;font-size:13px;color:var(--ink-soft);}
  .tab{cursor:pointer;letter-spacing:.2em;padding-bottom:4px;border-bottom:2px solid transparent;transition:all .2s;}
  .tab.on{color:var(--accent);border-color:var(--accent);}
  .panel{display:none;}
  .panel.on{display:block;}

  .logItem{padding:12px 2px;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .logItem .d{color:var(--ink-soft);font-size:12px;margin-right:10px;}
  .logItem.ev{color:var(--accent);}
  .logPager{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .pgBtn{
    min-width:32px;height:28px;padding:0 8px;border-radius:6px;cursor:pointer;
    border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);
    color:var(--paper);font-family:inherit;font-size:12px;
  }
  .pgBtn:hover{background:rgba(255,255,255,.18);}
  .pgBtn.on{background:var(--accent);border-color:var(--accent);color:#083048;}

  .friendCard{padding:16px 4px;border-bottom:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .favatar{width:36px;height:45px;image-rendering:pixelated;flex-shrink:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:6px;}
  .friendCard .fi{flex:1;}
  .friendCard .fn{font-size:14px;letter-spacing:.08em;}
  .friendCard .fn .city{color:var(--accent);font-size:12px;margin-left:10px;}
  .friendCard .fq{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .friendCard .fa{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .stageTag{font-size:11px;color:var(--good);border:1px solid rgba(168,230,207,.5);border-radius:999px;padding:0 8px;margin-left:8px;}
  .chatBtn{
    flex-shrink:0;border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--ink);
    font-size:12px;padding:5px 16px;border-radius:999px;cursor:pointer;transition:all .2s;font-family:inherit;letter-spacing:.15em;
  }
  .chatBtn:hover{background:rgba(255,255,255,.14);}

  .medalRow{display:flex;gap:34px;justify-content:center;margin:22px 0;}
  .medal{text-align:center;}
  .medal .m{font-size:26px;}
  .medal .c{font-size:12px;color:var(--ink-soft);letter-spacing:.15em;}
  .meetItem{padding:10px 2px;border-bottom:1px dashed var(--line);font-size:13px;color:var(--ink-soft);}
  .meetItem b{color:var(--ink);font-weight:normal;}

  .resetRow{text-align:center;margin-top:56px;}
  .resetRow span{font-size:12px;color:var(--ink-soft);cursor:pointer;letter-spacing:.15em;border-bottom:1px dashed var(--line);}

  /* ---------- 微信风聊天 ---------- */
  .wxChat{background:#ededed;border-radius:12px;padding:14px 12px;text-align:left;}
  .wxMsgs{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
  .wxRow{display:flex;align-items:flex-start;gap:8px;}
  .wxRow.me{flex-direction:row-reverse;}
  .wxAv{width:30px;height:30px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;}
  .bub{max-width:75%;background:#fff;color:#173140;border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.7;}
  .wxRow.me .bub{background:#95ec69;}
  .wxOpts{position:relative;height:150px;margin-top:18px;}
  .wxCard{position:absolute;left:50%;bottom:0;width:88px;height:122px;margin-left:-44px;transform-origin:50% 135%;transform:rotate(var(--rot,0deg));border:1px solid rgba(70,100,120,.45);border-radius:9px;background:linear-gradient(160deg,#4a7a9e,#2d5a7e);color:#dfeaf2;cursor:pointer;overflow:hidden;padding:0;font-family:inherit;box-shadow:0 4px 10px rgba(20,40,60,.35);transition:transform .22s ease, opacity .3s, border-color .3s, box-shadow .22s;}
  .wxCard:hover{transform:rotate(var(--rot,0deg)) translateY(-18px);box-shadow:0 12px 20px rgba(20,40,60,.45);z-index:40;}
  .wxCard .back{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;gap:3px;}
  .wxCard .back::before{content:'';position:absolute;inset:5px;border:1px solid rgba(255,255,255,.28);border-radius:6px;}
  .wxCard .back small{font-size:9px;letter-spacing:.3em;opacity:.7;}
  .wxCard .front{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:7px 6px;background:linear-gradient(160deg,#95ec69,#5aa85c);color:#173140;font-size:10.5px;line-height:1.45;text-align:center;border-radius:8px;}
  .wxCard.chosen{transform:translateY(-52px) scale(1.2);border-color:#5aa85c;box-shadow:0 16px 28px rgba(20,40,60,.5);z-index:50;}
  .wxCard.gone{opacity:0;transform:translateY(-8px) scale(.85);pointer-events:none;}
  .wxCard.open{border-color:#5aa85c;transform:translateY(-52px) scale(1.2);box-shadow:0 16px 28px rgba(20,40,60,.5);z-index:50;}
  .wxCard.open .front{display:flex;animation:cardFlip .45s ease;}
  .wxCard.open .back{display:none;}
  .wxCard.dim{opacity:.35;pointer-events:none;}
  .wxCard .delta{font-size:10.5px;margin-top:4px;font-weight:bold;}
  @keyframes cardFlip{0%{transform:rotateY(90deg) scale(.9);opacity:.4;}100%{transform:rotateY(0) scale(1);opacity:1;}}
  .wxOpt{background:#95ec69;color:#173140;border:none;border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer;font-family:inherit;text-align:left;line-height:1.6;transition:background .15s;}
  .wxOpt:hover{background:#8ce55e;}
  .wxEnd{background:transparent;border:1px dashed #b2b2b2;color:#8a8a8a;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;font-family:inherit;}

  /* ---------- 收藏 ---------- */
  .itemGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .itemCard{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--glass);}
  .itemCard .ic{font-size:26px;}
  .itemCard .nm{font-size:13.5px;margin-top:4px;}
  .itemCard .ct{font-size:12px;color:var(--ink-soft);line-height:1.6;}
  .heart{margin-right:2px;}
  .giftRow{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:10px 2px;font-size:13px;text-align:left;}

  /* ---------- 图鉴 ---------- */
  .dexGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .dexCell{border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;background:var(--glass);opacity:.4;transition:all .3s;cursor:pointer;}
  .dexCell:hover{border-color:rgba(174,229,242,.6);}
  .pcImg{width:100%;max-height:52vh;object-fit:cover;border-radius:12px;display:block;background:rgba(255,255,255,.08);min-height:120px;}
  .pcCap{font-size:12px;color:var(--ink-soft);margin-top:10px;letter-spacing:.2em;}
  .pcBig{font-size:60px;line-height:1.4;}
  .itemCard{cursor:pointer;}
  .itemCard:hover{border-color:rgba(174,229,242,.6);}
  .dexCell.on{opacity:1;border-color:rgba(174,229,242,.6);background:rgba(174,229,242,.10);}
  .dexCell .di{font-size:18px;}
  .dexCell .dn{font-size:11px;margin-top:2px;}
  .dexTitle{font-size:12px;color:var(--ink-soft);letter-spacing:.3em;margin:20px 0 10px;}
  .dexReward{font-size:12px;color:var(--good);margin-top:16px;line-height:2;}
  .pcImg.pixImg{image-rendering:pixelated;}

  /* ---------- 新手指引 ---------- */
  #tutWrap{display:none;}
  #tutWrap.on{display:block;}
  #tutShade{position:fixed;inset:0;background:rgba(10,12,24,.45);z-index:70;}
  #tutHi{position:fixed;z-index:71;display:none;border:2px solid rgba(174,229,242,.95);border-radius:12px;background:rgba(174,229,242,.08);box-shadow:0 0 0 4px rgba(174,229,242,.22), 0 0 26px rgba(174,229,242,.5);transition:all .25s;}
  .tutHiM{position:fixed;z-index:71;border:2px solid rgba(174,229,242,.95);border-radius:12px;background:rgba(174,229,242,.10);box-shadow:0 0 0 4px rgba(174,229,242,.22), 0 0 26px rgba(174,229,242,.5);cursor:pointer;transition:all .25s;}
  #tutWrap.on #tutHi{display:block;}
  #tutTip{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);z-index:72;max-width:78vw;background:#fff;color:#2a2440;border-radius:14px;padding:14px 18px;font-size:13.5px;line-height:1.8;box-shadow:0 10px 30px rgba(10,12,30,.35);text-align:center;}
  #tutTip .btn{margin-top:10px;background:#6b5f95;border-color:#6b5f95;color:#fff;}
  #tutTip .btn:hover{background:#574e7d;}
  #tutArrow{position:fixed;z-index:80;display:none;background:#fff;color:#2a2440;border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.7;text-align:center;box-shadow:0 8px 22px rgba(10,12,30,.32);}
  #tutArrow.on{display:block;animation:hintFloat 1.6s ease-in-out infinite;}

  /* ---------- 弹层 ---------- */
  #modal{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(4,32,46,.45);z-index:50;
  }
  /* 从设置里打开的玩法说明：要盖在设置弹窗上层 */
  #modal.above{z-index:58;}
  /* 房间文字：HTML 标签层，替换画布小字 */
  #roomLabels{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden;}
  .rlab{position:absolute;transform:translate(-50%,-50%);font-size:12px;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(30,25,45,.4);line-height:1;}
  .rlabL{transform:translate(0,-50%);color:rgba(255,255,255,.9);}
  /* 信纸：手写字 + 手账纸质感 */
  @font-face{font-family:'MailHand';src:url('assets/mail-hand.woff2') format('woff2');font-display:swap;}
  .letterPaper{background:linear-gradient(168deg,#faf5ea,#efe5d0);border-radius:8px;padding:18px 20px 14px;margin:4px 0;text-align:left;box-shadow:inset 0 0 34px rgba(150,115,60,.10);position:relative;}
  .letterPaper:before{content:'';position:absolute;left:14px;top:10px;bottom:10px;width:2px;background:rgba(180,140,80,.16);border-radius:2px;}
  .letterHand{font-family:'MailHand','STXingkai','华文行楷','Xingkai SC','KaiTi','楷体',serif;font-size:17px;line-height:1.95;color:#4a3b26;letter-spacing:.02em;}
  .letterSign{text-align:right;margin-top:10px;font-family:'MailHand','STXingkai','华文行楷','Xingkai SC','KaiTi','楷体',serif;font-size:15px;color:#8a6f48;}
  .mailCard{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.55);margin-bottom:8px;cursor:pointer;text-align:left;}
  .mailCard.unread{background:rgba(255,243,214,.78);}
  #modal.on{display:flex;}
  #setModal{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(4,32,46,.45);z-index:55;
  }
  #setModal.on{display:flex;}
  .modalCard{
    background:rgba(8,44,62,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.18);
    border-radius:18px;padding:40px 38px;max-width:400px;width:88%;
    max-height:88vh;overflow-y:auto;
    text-align:center;box-shadow:0 18px 50px rgba(4,32,46,.4);
  }
  .modalCard .mt{font-size:15px;letter-spacing:.25em;margin-bottom:16px;color:var(--accent);}
  .modalCard .mb{font-size:14px;line-height:2.1;}
  .modalCard .mb b{color:#fff;font-weight:normal;}
  #mdBtns{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  #mdBtns .btn{margin-top:0;}
  .toast{
    position:fixed;left:50%;bottom:40px;transform:translateX(-50%);
    background:rgba(8,44,62,.92);color:#fff;font-size:13px;padding:9px 24px;border-radius:999px;
    opacity:0;transition:opacity .4s;pointer-events:none;z-index:60;border:1px solid rgba(255,255,255,.15);
  }
  .toast.on{opacity:.95;}

  /* ---------- 训练节奏小游戏 ---------- */
  #swimGame{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,32,46,.55);z-index:55;}
  #swimGame.on{display:flex;}
  /* ---------- 比赛周位面 ---------- */
  #plane{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,32,46,.55);z-index:49;}
  #plane.on{display:flex;}
  .plCard{background:rgba(8,44,62,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:24px 22px 20px;width:94%;max-width:560px;text-align:center;box-shadow:0 18px 50px rgba(4,32,46,.4);}
  #plMap{display:block;image-rendering:pixelated;width:100%;border-radius:10px;margin:8px 0 6px;cursor:pointer;}
  #plStats{display:flex;gap:18px;justify-content:center;font-size:13px;color:#ffe9b8;margin:2px 0 0;}
  #plMsg{font-size:13px;color:#fff;min-height:44px;margin:4px 0 10px;line-height:1.7;}
  #plBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  #plMapWrap{position:relative;}

function rivalNew(city){
  if(S.rival) return;
  const pool = S.roster.filter(q=>q.r===city);
  const p = pool.length ? pick(pool) : pick(S.roster);
  S.rival = { name:p.n, city:p.r, born:S.day, h2h:{w:0,l:0}, pts:20, golds:0, lastYear:S.day, flags:{} };

}
function rivalHook(meetName, city, rank, isIntl){
  _rvQueue = [];
  if(!S.roster) return '';
  let first = false;
  if(!S.rival){
    if(isIntl || meetName === MEET_TIERS[0].name) return '';
    rivalNew(city);
    if(!S.rival) return '';
    first = true;
  }
  const rv = S.rival;
  rv.met = (rv.met||0) + 1;
  rv.pts = clamp((rv.pts||20) + 2, 0, 100);
  let rRank, beat;
  if(rank === 1){ rRank = 2; beat = false; }
  else if(Math.random() < 0.45){ rRank = Math.max(1, rank-1); beat = rRank < rank; }
  else { rRank = Math.min(8, rank+1); beat = false; }
  if(beat) rv.h2h.l++; else rv.h2h.w++;
  const rel = beat
    ? '这次比你快半个身位，拿了<b>第'+rRank+'名</b>。触壁之后看了你一眼，什么也没说。'
    : '在你身后<b>第'+rRank+'名</b>触壁，爬上来朝你伸出手：「行啊。下次换我领先。」';
  const head = first
    ? '看台上有一道视线跟了你一整场——<b>'+rv.name+'</b>，'+rv.city+'的，和你同一个项目。赛后他撞了撞你的肩膀：「游得不错。下次别让我等太久。」<br>'
    : '⚔ <b>'+rv.name+'</b>（'+rv.city+'）'+rel;

  const F = rv.flags;
  if(!F.firstWin && rv.h2h.w >= 1){
    F.firstWin = true;
    _rvQueue.push({t:'⚔ 第 一 场', b:'赢了'+rv.name+'半个身位。出水的时候他堵在池边，塞给你一瓶水：「行，这个我记下了。」<br><br>要不要回一句？', opts:[
      {label:'「下次继续」', cb:()=>{ rv.pts = clamp(rv.pts+4,0,100); addLog('你和'+rv.name+'约了下一场。', true); save(); }},
      {label:'「你也很强」', cb:()=>{ rv.pts = clamp(rv.pts+6,0,100); addLog('你夸了他。他耳朵红了，嘴上还说「那当然」。', true); save(); }}]});
  }

function strokeW(){
  if(!S.stroke) return BASE_W;

function strokeName(){
  if(!S.stroke) return '';
  const st = STROKES.find(x=>x.id===S.stroke);
  return st ? st.name : '';
}
function pickStroke(){
  const rank = [
    ['free',   S.talent], ['breast', S.tech],
    ['fly',    S.strength], ['back', S.diligence]
  ].sort((a,b)=>b[1]-a[1]);
  let st = STROKES.find(x=>x.id===rank[0][0]);
  if(S.strokeRefusedId && st.id === S.strokeRefusedId){
    st = STROKES.find(x=>x.id===rank[1][0] && x.id!==S.strokeRefusedId) || STROKES.find(x=>x.id!==S.strokeRefusedId) || st;
  }
  return st;
}

/* ================= 数值 ================= */
function fatigueMult(){
  let base = S.fatigue<50 ? 1 : (S.fatigue<80 ? 0.65 : 0.35);
  if(has('tr')) base = base + (1-base)*0.5;
  if(has('nl') && S.fatigue>=70) base *= 1.15;
  return base;
}
function affBuff(){
  let a = 0;
  S.friends.forEach(f=>{ a += Math.floor((f.aff||0)/3) * ((f.stage||0)>=3 ? 2 : 1); });
  return a * 0.01;
}
function growthMult(){
  let g = 1;
  if(has('wq')) g *= 1.2;
  if(has('dl')) g *= 1.08;
  g *= 1 + Math.min(S.friends.length,10) * (has('sj')?0.003:0.002);
  g *= 1 + affBuff();
  g *= S.globalMult||1;
  return g;
}
/* 天赋上限：天赋越低，单日训练量收益封顶越低 */
function talentCap(){
  return 4 + S.talent*0.16;
}
/* 年龄阶段：年龄影响训练效果 */
function ageStage(){
  const a = S.age;
  if(a<=13) return {name:'童子班', gain:1.0, tech:1.3, strength:0.75, note:'年纪小，水感学得飞快，力量还得慢慢长'};
  if(a<=17) return {name:'青苗期', gain:1.1, tech:1.1, strength:0.9,  note:'长身体的年纪，进步快，也容易累'};
  if(a<=23) return {name:'黄金期', gain:1.0, tech:1.0, strength:1.0,  note:'运动员最好的年纪'};
  if(a<=30) return {name:'成熟期', gain:0.95, tech:1.1, strength:0.9, note:'经验在涨，恢复变慢了'};
  return        {name:'老将',   gain:0.85, tech:1.2, strength:0.85, note:'靠经验吃饭，每一分训练量都珍贵'};
}

/* 主课训练：结算收益（状态越好，倍率越高） */
function finishMain(mult){
    sfx('splash');
    laneSwim();
    S.restStreak = 0;
    const dip = restDip();
    let gain = (10 + S.diligence*0.10 + R(6)) * mult * fatigueMult() * growthMult() * ageStage().gain * dip * season().gain;
    if(S.buffDay===S.day) gain *= 1.5;
    let gelNote = '';
    if(S.coachUntil && S.day <= S.coachUntil) gain *= 1.2; // 好友陪练：聊天独有
    if(S.gelBuff){ gain *= 2; S.gelBuff=false; gelNote = '（能量胶生效，效果翻倍）'; }
    const cramp = tapeActive() ? false : Math.random() < 0.07;
    if(cramp){ gain *= 0.5; S.fatigue = clamp(S.fatigue+4, 0, 100); }
    gain = Math.max(1, Math.round(gain));
    const cap = Math.round(talentCap());
    const capped = gain > cap;
    gain = Math.min(gain, cap);
    S.trained += gain;
    S.fatigue = clamp(S.fatigue + Math.round((16 - S.diligence*0.05 + R(6)) * season().fat), 0, 100);
    S.tech = Math.min(100, S.tech + 0.3);
    addLog('主课训练'+(S.sick?'（带病上场）':'')+(cramp?'，中途小腿抽筋，量打了折':'')+gelNote+(dip<1?'（歇太久了，状态有点下滑）':'')+'，训练量 +'+gain+'。'+(capped?'（天赋所限，今天再练也吞不下更多了）':'')+fatigueNote());
}

function sgPrep(){
  window._dqFlag = false;

  $('sgNeedle').style.visibility = 'hidden';
  $('sgDots').textContent = '';

  }, 1200 + Math.random()*2200);
}
function sgNext(){
  _sg.round++;
  const N = _sg.cfg.rounds || 8;
  if(_sg.round > N){ sgFinish(); return; }
  const zw = Math.max(10, 22 - _sg.round*1.5);
  _sg.zoneW = zw;
  _sg.zoneL = 15 + Math.random()*(70-zw);
  $('sgZone').style.left = _sg.zoneL+'%';
  $('sgZone').style.width = zw+'%';
  $('sgSub').textContent = '第 '+_sg.round+'/'+N+' 下 · 白线滑进绿区时按「划水」';
  $('sgNeedle').style.left = '0%';
  _sg.pos = 0; _sg.dir = 1;
  const speed = (_sg.cfg.speedBase||1.15) + _sg.round*(_sg.cfg.speedInc||0.28);
  clearInterval(_sg.timer);
  _sg.timer = setInterval(()=>{
    _sg.pos += _sg.dir*speed;
    if(_sg.pos >= 100){ _sg.pos = 100; _sg.dir = -1; }
    if(_sg.pos <= 0){ _sg.pos = 0; _sg.dir = 1; }
    $('sgNeedle').style.left = _sg.pos+'%';
  }, 16);
}
function sgTap(){
  if(!_sg || _sg.over) return;
  if(_sg.phase === 'ready'){
    clearTimeout(_sg.goTimer);
    _sg.falseStarts++;
    sfx('miss');
    if(_sg.falseStarts >= 2){
      window._dqFlag = true;
      _sg.phase = 'swim';
      $('sgDots').textContent = 'DQ';
      $('sgSub').textContent = '两次抢跳——取消资格（DQ）';
      setTimeout(sgFinish, 900);
      return;
    }
    $('sgSub').textContent = '抢跳！召回重赛——再有一次就取消资格';
    setTimeout(sgPrep, 900);
    return;
  }
  if(_sg.phase === 'go'){
    const rt = (performance.now() - _sg.t0) / 1000;
    _sg.phase = 'swim';
    $('sgZone').style.visibility = 'visible';
    $('sgNeedle').style.visibility = 'visible';
    if(rt < 0.22){ _sg.bonusHit = 1; sfx('hit'); }
    else if(rt > 0.45){ _sg.bonusHit = -1; sfx('miss'); }
    else { _sg.bonusHit = 0; }
    $('sgDots').textContent = '出发 ' + rt.toFixed(2) + 's';
    $('sgSub').textContent = '出发反应 '+rt.toFixed(2)+' 秒'+(_sg.bonusHit>0?'——快如离弦之箭，领先半个身位！':(_sg.bonusHit<0?'——慢了半拍，追吧。':''));
    setTimeout(sgNext, 900);
    return;
  }
  const hit = _sg.pos >= _sg.zoneL && _sg.pos <= _sg.zoneL + _sg.zoneW;
  if(hit){ _sg.hits++; $('sgDots').textContent += '✓'; sfx('hit'); } else { $('sgDots').textContent += '×'; sfx('miss'); }
  sgNext();
}
function sgFinish(){
  _sg.over = true;
  clearInterval(_sg.timer);
  const hits = Math.max(0, _sg.hits + (_sg.bonusHit||0)), done = _sg.done;
  setTimeout(()=>{
    $('swimGame').classList.remove('on');
    $('sgDots').textContent = '';
    $('sgFan').style.display = 'none';
    _sg = null;
    done(hits);
  }, 500);
}

/* 轻音效：WebAudio 合成，不加载任何文件 */
let _ac = null;
function sfx(t){
  if(S && S.volSfx != null && S.volSfx <= 0) return;
  try{
    _ac = _ac || new (window.AudioContext||window.webkitAudioContext)();
    if(_ac.state==='suspended') _ac.resume();
    const seq = t==='hit'  ? [[880,'square',.06]]
             : t==='miss' ? [[196,'sawtooth',.08]]
             : t==='open' ? [[392,'triangle',.07],[523,'triangle',.07]]
             : t==='win'  ? [[523,'square',.1],[659,'square',.1],[784,'square',.1],[1047,'square',.22]]
             : t==='page' ? [[523,'triangle',.05],[659,'triangle',.07]]
             : t==='splash'? [[340,'sine',.1],[190,'sine',.16]]
             : t==='gym'  ? [[150,'square',.07],[110,'square',.1]]
             : t==='rest' ? [[660,'sine',.1],[440,'sine',.14]]
             : t==='sparkle'? [[1319,'triangle',.05],[1568,'triangle',.05],[2093,'triangle',.09]]
             : t==='gift' ? [[784,'triangle',.07],[988,'triangle',.1]]
             : t==='coin' ? [[988,'square',.05],[1319,'square',.08]]
             : t==='chime'? [[659,'triangle',.08],[784,'triangle',.08],[1047,'triangle',.14]]
             : t==='beep' ? [[1046,'square',.16]]
             : t==='sad'  ? [[330,'sine',.16],[247,'sine',.22]]
             : [];
    const vs = (S && S.volSfx!=null ? S.volSfx : 70) / 100;
    let dt = 0;
    seq.forEach(s=>{
      const o = _ac.createOscillator(), g = _ac.createGain();
      o.type = s[1]; o.frequency.value = s[0];
      g.gain.setValueAtTime(Math.max(.0001, .045*vs), _ac.currentTime+dt);
      g.gain.exponentialRampToValueAtTime(.0001, _ac.currentTime+dt+s[2]);
      o.connect(g); g.connect(_ac.destination);
      o.start(_ac.currentTime+dt); o.stop(_ac.currentTime+dt+s[2]+.02);
      dt += s[2]*.9;
    });
  }catch(e){}
}

/* ================= 背景音乐（WebAudio 合成循环） ================= */
let _bgm = null;
const BGM_PAT = [523,0,659,784,0,880,784,659, 523,0,440,523,587,0,659,0];
function volSfx(){ return (S && S.volSfx!=null) ? S.volSfx : 70; }
function volMusic(){ return (S && S.volMusic!=null) ? S.volMusic : 30; }
function bgmEnsure(){
  try{
    _ac = _ac || new (window.AudioContext||window.webkitAudioContext)();
    if(_ac.state==='suspended') _ac.resume();
    if(!_bgm){
      _bgm = {step:0, next:_ac.currentTime+.3};
      setInterval(bgmTick, 180);
    }
  }catch(e){}
}
function bgmTick(){
  try{
    if(!_ac || !_bgm) return;
    const v = volMusic()/100;
    const ahead = _ac.currentTime + .45;
    while(_bgm.next < ahead){
      const f = BGM_PAT[_bgm.step % 16];
      const t = _bgm.next;
      if(f && v > 0){
        const o = _ac.createOscillator(), g = _ac.createGain();
        o.type='triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t);
        g.gain.linearRampToValueAtTime(.055*v, t+.09);
        g.gain.exponentialRampToValueAtTime(.0001, t+.52);
        o.connect(g); g.connect(_ac.destination);
        o.start(t); o.stop(t+.58);
        if(_bgm.step % 8 === 0){
          const b = _ac.createOscillator(), bg = _ac.createGain();
          b.type='sine'; b.frequency.value = (_bgm.step % 16 === 0 ? 131 : 98);
          bg.gain.setValueAtTime(.0001, t);
          bg.gain.linearRampToValueAtTime(.07*v, t+.12);
          bg.gain.exponentialRampToValueAtTime(.0001, t+1.9);
          b.connect(bg); bg.connect(_ac.destination);
          b.start(t); b.stop(t+2);
        }
      }
      _bgm.step++;
      _bgm.next += .32;
    }
  }catch(e){}
}

    for(let y=16;y<=42;y++){ const dx=Math.round((42-y)*2.2); g.fillRect(4,y,dx,1); g.fillRect(60-dx,y,dx,1); }
    g.fillStyle=LINE;
    for(let y=16;y<=42;y++){ const dx=Math.round((42-y)*2.2); g.fillRect(3+dx,y,1,1); g.fillRect(60-dx,y,1,1); }
  } else {
    // 闭合盖（向下三角）+ 火漆印
    g.fillStyle=P;
    for(let r=0;r<=14;r++){ const dx=Math.round(r*2); g.fillRect(4+dx,16+r,Math.max(0,56-dx*2),1); }
    g.fillStyle=LINE;
    for(let r=0;r<=14;r++){ const dx=Math.round(r*2); g.fillRect(3+dx,16+r,1,1); g.fillRect(60-dx,16+r,1,1); }
    g.fillStyle=SEAL; g.fillRect(29,22,6,6); g.fillRect(28,23,8,4); g.fillRect(31,24,2,2);
  }
  // 底边阴影
  g.fillStyle='#b7a274'; g.fillRect(2,44,60,1);
}

/* ================= 一天的推进 ================= */
function doAction(kind){
  if(!S || S.over) return;
  if(kind==='treat'){
    sfx('rest');
    S.sick=false; S.health=clamp(S.health+10,0,100);
    addLog('看了医生，吃了药，好好睡了一觉。');
  }
  else if(kind==='rehab'){ openRehab(); return; }
  else if(kind==='main'){
    finishMain(1); afterAction('main');
    return;
  }
  else if(kind==='tech'){
    sfx('gym');
    laneLand('tech');
    S.restStreak = 0;
    let g = (2 + R(2)) * growthMult() * (S.sick?0.4:fatigueMult()) * ageStage().tech * restDip();
    const cramp = tapeActive() ? false : Math.random() < 0.05;
    if(cramp){ g *= 0.5; S.fatigue = clamp(S.fatigue+4, 0, 100); }
    S.tech = Math.min(100, S.tech + Math.max(0.5, g));
    S.fatigue = clamp(S.fatigue + 9 + R(4), 0, 100);
    addLog('技术课，专抠转身和出发。'+(cramp?'（中途抽筋，效果减半）':''));
  }
  else if(kind==='strength'){
    sfx('gym');
    laneLand('gym');
    S.restStreak = 0;
    let g = (2 + R(2)) * growthMult() * (S.sick?0.4:fatigueMult()) * ageStage().strength * restDip();
    const cramp = tapeActive() ? false : Math.random() < 0.05;
    if(cramp){ g *= 0.5; S.fatigue = clamp(S.fatigue+4, 0, 100); }
    S.strength = Math.min(100, S.strength + Math.max(0.5, g));
    S.fatigue = clamp(S.fatigue + 12 + R(5), 0, 100);
    addLog('陆上力量课，撸铁撸到手抖。'+(cramp?'（中途抽筋，效果减半）':''));
  }
  else if(kind==='rest'){
    sfx('rest');
    laneLand('sleep');
    S.restStreak = (S.restStreak||0) + 1;
    S.fatigue = clamp(S.fatigue - Math.round(30*restMult()), 0, 100);
    S.health = clamp(S.health + 6, 0, 100);
    let note = S.sick ? '病还没好，今天在宿舍躺着。' : '休息日，睡到自然醒，身体轻了一点。';
    if(S.restStreak > 2) note += '（连着歇了'+S.restStreak+'次，肌肉有点松了——下次训练效果 -'+Math.round((1-restDip())*100)+'%）';
    addLog(note);
    if(S.sick){ S.sick=false; addLog('病好了。'); }
  }
  afterAction(kind);
}
function afterAction(kind){
  if(!S.sick && kind!=='treat'){
    if(Math.random() < sickChance()){
      S.sick = true;
      addLog('鼻子一酸——感冒了，明天可能练不动。', true);
    }
  }
  if(S.sick) S.health = clamp(S.health-3, 0, 100);
  if(S.sick) S.sickCount = (S.sickCount||0)+1;
  if(S.fatigue >= 100) S.burn100 = (S.burn100||0)+1;
  // 伤病预警：还差两次就提前终结生涯时提醒一次
  if(!S.warnedInjury && (S.burn100||0) >= 2){
    S.warnedInjury = true;
    sfx('sad');
    addLog('队医把你叫到一边：身体已经亮黄灯了。', true);
    showModal('身 体 警 报',
      '队医把你叫到一边，眉头拧着：「疲惫拉满 <b>100</b> 已经 <b>'+(S.burn100||0)+'</b> 次了。」<br><br>「再硬扛两次，身体会先于梦想撂下去的——<b>拉满 4 次，生涯就到这</b>。」<br><br><span style="font-size:12px;color:var(--ink-soft)">多休息，照顾好自己。生涯不能重来。</span>');
  }
  // 训练中偶尔拾到纪念品
  if(kind!=='treat' && Math.random() < 0.05){
    gainItem(pick(GENERICS));
  }

  S.day += TICK;
  S.chats = 0;
  // 换季：90 天一季
  const ns = seasonOf(S.day);
  if(S.lastSeason === undefined) S.lastSeason = ns;
  if(ns !== S.lastSeason){ S.lastSeason = ns; seasonTurn(); }
  // 生日与年龄增长（360 天 = 1 岁）
  const na = S.startAge + Math.floor((S.day-1)/360);
  if(na > S.age){ S.age = na; addLog('过了个生日——'+S.age+' 岁了，生日愿望是游得再快一点。', true); yearlyTick(); }
  rivalYearly();
  checkEndings();
  careerEndCheck();
  // 40 岁：规则请你上岸
  if(!S.over && S.age >= 40){
    addLog('40 岁了。规则写着：该上岸了。', true);
    forceEnd('retire40');
    save(); render(); return;
  }
  // 35 岁的岔路口：天赋不够，国际赛的前三够不着了
  if(!S.over && !S.coachAsked && S.age >= 35 && S.talent < 60){
    S.coachAsked = true; save();
    queueModal('三 十 五 岁',
      '35 岁了。天赋停在 '+Math.round(S.talent)+'——教练翻着你的成绩册，欲言又止。<br><br>这个天赋，国际赛的前三可能真的够不着了。<br><br>要不要……试试另一条路？',
      [
        {label:'接过教鞭', cb:()=>{ setTimeout(()=>forceEnd('coach'), 0); }},
        {label:'再游几年', cb:()=>{ addLog('你说：我还想再游几年。教练点点头，没再提这件事。', true); save(); }}
      ]);
  }
  // 队内考核：每 200 天一个周期，训练量不达标会被筛出队伍
  if(!S.assess) S.assess = { next: S.day + 200, last: S.trained, streak: 0, fails: 0 };
    if(S.assess.streak===undefined) S.assess.streak = 0;
    if(S.assess.fails===undefined) S.assess.fails = 0;
  if(!S.over && S.day >= S.assess.next) runAssessment();
  if(S.over){ save(); render(); return; }
  // 练满一年：教练定主项
  if(!S.over && !S.stroke && S.day >= (S.strokeRefusedId ? 720 : 360)) offerStroke();
  // 有 3 个好友后，偶尔组 4x100 接力
  if(!S.over && !S.relayDay && S.trialIdx>=1 && S.friends.length>=3 && Math.random()<0.02){
    S.relayDay = S.day + 20 + R(20);
    addLog('教练在走廊叫住你：队里要组 4x100 接力，让你挑三个伙伴。');
  }
  if(!S.over && S.relayDay && S.day >= S.relayDay){ S.relayDay = null; offerRelay(); }
  // 训练间隙捡硬币
  if(!S.over && (kind==='main'||kind==='tech'||kind==='strength') && Math.random()<0.08){
    const c = 1 + R(3); S.coins = (S.coins||0) + c;
    addLog('训练间隙在池边瓷砖缝里抠到 '+c+' 枚硬币。');
  }
  // 训练偶遇宿敌：憋气对决
  if(!S.over && S.rival && (kind==='main'||kind==='tech'||kind==='strength') && Math.random()<0.06){
    holdDuelStart(); save(); render(); return;
  }
  if(S.over){ save(); render(); return; }
  randomEvent();
  fanMailTick();
  scheduleTrial();
  offerTrial();
  scheduleMeet();
  offerMeet();
  offerRetire();
  offerInternational();
  save();
  render();
}
/* ===== 队内考核：训练量不达标就淘汰 ===== */
function assessNeed(){
  return 60 + S.trialIdx*30;
}
/* 队内考核提示：让玩家随时知道本周期达标线，不用心惊胆战 */
function renderStrokeNote(){
  if(!S){ return; }
  $('strokeNote').innerHTML = S.stroke
    ? '🏊 主项 · <b>'+strokeName()+'</b> —— '+STROKES.find(x=>x.id===S.stroke).desc
    : '<span style="opacity:.75">🏊 主项未定 —— 练满一年，教练会来找你谈话</span>';
}
function renderSeasonNote(){
  if(!S || S.over){ return; }
  const se = season();
  const pct = v => (v===1 ? '' : (v>1 ? ' +' : ' ') + Math.round((v-1)*100) + '%');
  $('seasonNote').innerHTML = se.icon+' <b>'+se.note+'</b><span style="color:var(--ink-soft);font-size:12px">（收益'+pct(se.gain)+' · 疲惫'+pct(se.fat)+'）</span>';
}
function renderAssessNote(){
  if(!S || S.over){ return; }
  if(!S.assess){ $('assessNote').textContent = ''; return; }
  const need = assessNeed();
  const got = S.trained - (S.assess.last==null ? 0 : S.assess.last);
  const left = Math.max(0, S.assess.next - S.day);
  const gap = Math.max(0, need - got);
  const st = S.assess.streak || 0, fa = S.assess.fails || 0;
  $('assessNote').innerHTML = '📋 队内考核 · 本周期已练 <b>'+got+'</b> / 达标线 '+need
    + (gap>0 ? '（还差 <b>'+gap+'</b>）' : '（<b>已达标 ✓</b>）')
    + ' · 剩 '+left+' 天 · 连续未达标 '+st+'/2 · 累计 '+fa+'/5';
}
function runAssessment(){
  const got = S.trained - (S.assess.last==null ? 0 : S.assess.last);
  const need = assessNeed();
  S.assess.next = S.day + 200;
  S.assess.last = S.trained;
  if(got >= need){
    S.assess.streak = 0; // 达标清零连续偷懒计数，累计偷懒保留
    addLog('队内考核：本周期训练量 '+got+'（标准 '+need+'），达标。', true);
    toast('📋 队内考核通过 · 训练量 +'+got);
  } else {
    S.assess.streak = (S.assess.streak||0) + 1;
    S.assess.fails = (S.assess.fails||0) + 1;
    if(S.assess.streak >= 2 || S.assess.fails >= 5){
      addLog('队内考核再次不达标（连续 '+S.assess.streak+' 次，累计 '+S.assess.fails+' 次），你被筛出了队伍。', true);
      forceEnd('cut');
    } else {
      sfx('sad');
      addLog('队内考核未达标：训练量 '+got+'/'+need+'。', true);
      queueModal('队 内 考 核',
        '教练把考核表折起来，敲了敲你的柜门：<br><br>「这个周期训练量 <b>'+got+'</b>，标准是 <b>'+need+'</b>。」<br><br>「队里不养闲人——<b>连着两个周期不达标，或者累计五个</b>，你就得把柜子腾出来了。」<br><br><span style="font-size:12px;color:var(--ink-soft)">200 天后重新考核 · 连续未达标 '+S.assess.streak+'/2 · 累计未达标 '+S.assess.fails+'/5</span>');
      if(S.mates && S.mates.length) queueModal('更 衣 室 便 签', '<div style="font-size:13px;color:var(--ink-soft)">'+pick(S.mates).name+' 贴在你柜门上的：</div><br><br>「'+pick(WARN_NOTES)+'」');
    }
  }
  save();
}
/* 休息滑坡：连续休息后训练效果下降 */
function restDip(){
  const st = S.restStreak||0;
  if(st <= 2) return 1;
  return clamp(1 - 0.05*(st-2), 0.6, 1);
}

}

/* ================= 选拔赛：随机事件 + 弹框选择 ================= */
function scheduleTrial(){
  if(S.trialIdx < TRIALS.length && S.trained >= TRIALS[S.trialIdx] && S.trialDay===null){
    const wait = (1+R(3))*TICK;
    S.trialDay = S.day + wait;
    addLog('教练拍拍你的肩：最近练得不错，'+wait+'天后队里可能有一场选拔赛，随时准备。', true);
  }
}
function offerTrial(){
  if(S.trialDay !== null && S.day >= S.trialDay){
    const tier = MEET_TIERS[S.trialIdx];
    const p = trialChance();
    queueModal('选 拔 赛',
      '今天队里临时宣布有一场选拔赛，通过的可以去打<b>「'+tier.name+'」</b>。<br><br>你的状态：疲惫 '+S.fatigue+(S.sick?' · 还在生病':'')+'<br>胜算大约 <b>'+Math.round(p*100)+'%</b>。<br><br>参不参加？',
      [
        {label:'跳下去', cb:runTrial},
        {label:'这次算了', cb:()=>{ S.trialDay = S.day + (3+R(4))*TICK; addLog('这次选拔没报名，教练说下次还有机会。'); }}
      ]);
  }
}
function trialChance(){
  let p = 0.32 + S.talent*0.004 + S.diligence*0.002 - S.fatigue*0.003 - (S.sick?0.15:0);
  return clamp(p, 0.08, 0.95);
}
function runTrial(){
  S.trialDay = null;
  const tier = MEET_TIERS[S.trialIdx];
  if(Math.random() < trialChance()){
    S.trialIdx++;
    queueModal('选 拔 赛', S.name+'深吸一口气，跳了下去。<br><br>通过了<b>「'+tier.name+'」</b>的选拔！');
    addLog('选拔赛通过！获得'+tier.name+'参赛资格。', true);
    scheduleMeet();
  }else{
    const wait = (2+R(3))*TICK;
    S.trialDay = S.day + wait;
    queueModal('选 拔 赛', S.name+'这一趟游得急了。<br><br>选拔没有通过，教练说：'+wait+'天后还有一次机会。');
    addLog('选拔赛未通过，'+wait+'天后可以再试。');
  }
  save();
}

function runMeet(tier, city){
  S.meetDay = null;
  const closeFs = S.friends.filter(f=>(f.stage||0)>=3);
  const fan = closeFs.length ? pick(closeFs) : ((S.friends.length && Math.random()<0.5) ? pick(S.friends) : null);
  openSwimGame(hits=>runMeetResult(tier, city, hits, fan), {rounds:8});

/* 好友到场观赛：赛后一句台词，好感 +1 */
function fanLine(fan, rank){
  if(!fan) return '';
  const win = rank<=3;
  const say = win ? pick(['太帅了！我就说你可以！','看台第一排，看得手心都是汗！','拿了个牌！晚上请你吃饭！'])
                  : pick(['没关系，下次我还在。','你出发的样子已经很帅了。','走，吃点好的，别复盘了。']);
  fan.aff = Math.min(100,(fan.aff||0)+1); checkAffStage(fan);
  return '<br><br>看台上的<b>'+fan.name+'</b>喊得最大声：「'+say+'」<span style="font-size:12px;color:var(--ink-soft)">（好友到场，本场发挥 +5）</span>';
}
function runMeetResult(tier, city, hits, fan){
  const bonus = hits*2 - 8;
  const w = strokeW();
  const mine = S.talent*w.talent + S.tech*w.tech + S.strength*w.strength + S.diligence*w.dil + (100-S.fatigue)*0.10 + R(14)-7 + bonus
    + (S.suitBuff?12:0) + (fan?5:0) - (S.meetDistract?10:0) - (window._dqFlag?9999:0);
  if(S.suitBuff){ S.suitBuff=false; addLog('竞速泳衣贴身如肤，划水都利落了几分。', true); }
  S.meetDistract = false; S.sponsorAsked = false;
  let better = 0;
  for(let i=0;i<7;i++){
    const rv = tier.rivals[0] + Math.random()*(tier.rivals[1]-tier.rivals[0]);
    if(rv > mine) better++;
  }
  const rank = better+1;
  if(rank===1){ S.goldStreak = (S.goldStreak||0)+1; } else { S.goldStreak = 0; }
  let medalTxt = '', rankTxt = '第'+rank+'名';
  if(rank===1){ S.medals.gold++; medalTxt='🥇 金牌'; sfx('win'); S.coins = (S.coins||0)+8; }
  else if(rank===2){ S.medals.silver++; medalTxt='🥈 银牌'; S.coins = (S.coins||0)+5; }
  else if(rank===3){ S.medals.bronze++; medalTxt='🥉 铜牌'; S.coins = (S.coins||0)+3; }
  S.meets.push({day:S.day, city, name:tier.name, rank});
  addLog(tier.name+' · 100米'+(strokeName()||'混合')+'（'+city+'）：'+rankTxt+(medalTxt?'，'+medalTxt:'')+'。', true);
  // 比赛纪念品：明信片带城市邮戳，其余通用品
  if(Math.random() < 0.30) gainItem('card', city);
  else if(Math.random() < 0.22) gainItem(pick(GENERICS));
  // 老朋友寄明信片
  palPostcard();
  const rvExtra = rivalHook(tier.name, city, rank, false);
  let extra = '';
  // 级别越高，认识的人越多
  const meetChances = S.trialIdx>=3 ? [0.65,0.5,0.4] : (S.trialIdx>=2 ? [0.65,0.45] : [0.65]);
  meetChances.forEach(ch=>{ if(Math.random() < ch){ const e = makeFriend(city); if(e) extra += e; } });
  const bonusTxt = '<span style="font-size:12px;color:var(--ink-soft)">（划水节奏 '+hits+'/8，发挥'+(bonus>=0?'+':'')+bonus+(window._dqFlag?'；⚠ 抢跳两次，出发犯规':'')+'）</span>';
  showModal(tier.name+' · 100米'+(strokeName()||'混合'), city+'的泳池，八条泳道。<br><br>'+bonusTxt+'<br><br>'+S.name+'拿到了<b>'+rankTxt+'</b>'+(medalTxt?'，'+medalTxt:'')+'。'+(rank===1?mateNote(WIN_NOTES):'')+fanLine(fan, rank)+extra+rvExtra);
  drainRival();
  checkEndings();
  scheduleTrialIfNeeded();
  if(S.trialIdx >= 1){
    const wait = 40+R(40);
    S.meetDay = S.day + wait;
    addLog('下一场比赛定在'+wait+'天后。');
  }
  save();
}
function makeFriend(city, intl){
  let cand = S.roster.map((p,i)=>({p,i})).filter(o=>!S.metIdx.includes(o.i) && o.p.r===city);
  if(!cand.length) cand = S.roster.map((p,i)=>({p,i})).filter(o=>!S.metIdx.includes(o.i));
  if(!cand.length) return '';
  const pickd = pick(cand);
  S.metIdx.push(pickd.i);
  const p = pickd.p;
  const favs = SOUVENIRS.slice().sort(()=>Math.random()-0.5).slice(0,2).map(s=>s.id);
  const f = { name:p.n, city:p.r, quirk:p.q, aff:0, fav:favs, stage:0, intl:p.intl };
  S.friends.push(f);
  addLog('结识了来自'+p.r+'的好友：'+p.n+'——'+p.q+'。', true);
  return '<br><br>赛后认识了一个'+p.r+'的选手，叫<b>'+p.n+'</b>——'+p.q+'。可以在「好友」里找TA聊天。';
}
function scheduleTrialIfNeeded(){
  if(S.trialIdx < TRIALS.length && S.trained >= TRIALS[S.trialIdx] && S.trialDay===null){
    const wait = (1+R(3))*TICK;
    S.trialDay = S.day + wait;
    addLog('训练量够了，教练：'+wait+'天后又有选拔赛，别松劲。', true);
  }
}
/* 老朋友（好感≥50）比赛后寄明信片 */
function palPostcard(){
  const pals = S.friends.filter(f=>(f.stage||0)>=1);
  if(!pals.length || Math.random()>=0.5) return;
  const f = pick(pals);
  if(f.intl){
    const loc = INT_LOCS.find(l=>l.city===f.city);
    gainItem('card', f.city, loc ? loc.country : f.city);
  }else{
    gainItem('card', f.city);
  }
  addLog(f.name+'从'+f.city+'寄来一张明信片：「想你了，赛道上见。」', true);
}

/* 强制结束：结局 = 生涯到此为止（champion/farewell/injury/cut/retire40） */
function forceEnd(id, extraLine){
  S.over = true;
  S.lastEndId = id;

  sfx(win ? 'win' : 'sad');
  if(!S.endings[id]) S.endings[id] = true;
  seenEnd(id);
  addLog('生涯结束——达成结局「'+ENDINGS.find(x=>x.id===id).t+'」。', true);
  recordHistory(id);
  save();
  const m = S.medals;
  const e = ENDINGS.find(x=>x.id===id);
  const useFile = !!e.img;
  const src = useFile ? e.img : drawEndArt(id);
  const errAttr = useFile ? (e.draw ? ' onerror="this.onerror=null;this.src=drawEndArt(\''+id+'\')"' : ' onerror="pcImgFail(this)"') : '';
  _mq.push({t:'结 局 · '+e.t,
    b:'<img class="pcImg pixImg" src="'+src+'"'+errAttr+'><div class="pcCap">'+e.t+'</div>'+(extraLine?extraLine+'<br><br>':'')+e.b.replace(/\{name\}/g, S.name)+(S.mates&&S.mates.length?'<br><br><span style="font-size:12px;color:var(--ink-soft)">柜门上的最后一张便签 · '+pick(S.mates).name+'：「'+pick(FAREWELL_NOTES)+'」</span>':'')+(S.rival?'<br><br><span style="font-size:12px;color:var(--ink-soft)">⚔ 宿敌 · '+S.rival.name+'：「'+(RIVAL_ENDS[id]||RIVAL_ENDS.def)+'」</span>':'')});
  _mq.push({t:'手 账 之 后',
    b:'泳池生涯 · '+fmtMonths(Math.ceil(S.day/30))+'<br>累计训练量 '+S.trained+'<br>奖牌 🥇'+m.gold+' 🥈'+m.silver+' 🥉'+m.bronze+'<br>朋友 '+S.friends.length+' 人<br>成就 '+ACH.filter(a=>S.ach&&S.ach[a.id]).length+' / '+ACH.length+'<br><br>'+(id==='injury'?'不是不想游，是身体先说了再见。':(id==='farewell'?'那片水，会记得TA来过。':(id==='champion'?'掌声落下，TA把最好的年纪留给了泳池。':'手账合上了，泳池记得每一个认真游过的人。'))),
    btns:[{label:'翻到后来篇', cb:()=>{ setTimeout(openLater, 0); }},{label:'重新翻开一本手账', cb:resetGame}]});
  flushMilestones();
}

function startMeetPlane(tier, tIdx, city, opt){
  opt = opt || {};
  S.meetDay = null;
  const main = S.stroke || 'free';

function offerInternational(){
  if(S.over) return;
  if(S.trialIdx < TRIALS.length || S.intCount > 0) return;
  if(S.trained < TRIALS[TRIALS.length-1] + 200) return;
  if(Math.random() >= 0.06) return;
  const meet = pick(INT_MEETS);
  const loc = pick(INT_LOCS);
  let rivals = INT_RIVALS[meet] || [100,114];
  let isOlympic = false;
  if(Math.random() < 0.15){ meet = '奥运会'; rivals = INT_RIVALS['奥运会']; isOlympic = true; }
  S.intCount++;
  fireEnvelope(meet==='奥运会' ? '奥 运 会 邀 请' : '国 际 邀 请',
    '一封从<b>'+loc.city+'</b>（'+loc.country+'）寄来的邀请函：<b>'+meet+'</b>'+(isOlympic?'。<br><br><b>这是奥运会。</b>全世界的目光都在这里。':'。<br><br>全世界的快泳手都会去。你的名字，也在名单上。')+'<br><br>去吗？',
    ()=>runIntMeet(meet, loc.city, loc.country, rivals, isOlympic),
    ()=>{ S.intCount = 0; addLog('婉拒了'+loc.city+'的邀请，先把国内的路走稳。'); });
}
function runIntMeet(meet, city, country, rivals, isOlympic){
  rivals = rivals || INT_RIVALS[meet] || [100,114];
  startMeetPlane({name:meet+' · 国际', rivals:rivals}, 9, city, {intl:true, country:country, isOlympic:!!isOlympic});
}
function runIntMeetResult(meet, city, country, rivals, hits, fan){
  rivals = rivals || INT_RIVALS[meet] || [100,114];
  const bonus = hits*2 - 8;
  const w = strokeW();
  const mine = S.talent*w.talent + S.tech*w.tech + S.strength*w.strength + S.diligence*w.dil + (100-S.fatigue)*0.10 + R(14)-7 + bonus
    + (S.suitBuff?12:0) + (fan?5:0) - (S.meetDistract?10:0) - (window._dqFlag?9999:0);
  if(S.suitBuff){ S.suitBuff=false; addLog('竞速泳衣贴身如肤，划水都利落了几分。', true); }
  S.meetDistract = false;
  let better = 0;
  for(let i=0;i<7;i++){
    const rv = rivals[0] + Math.random()*(rivals[1]-rivals[0]);
    if(rv > mine) better++;
  }
  const rank = better+1;
  if(rank===1){ S.goldStreak = (S.goldStreak||0)+1; } else { S.goldStreak = 0; }
  let medalTxt = '', rankTxt = '第'+rank+'名';
  if(rank===1){ S.medals.gold++; medalTxt='🥇 金牌'; sfx('win'); S.coins = (S.coins||0)+8; }
  else if(rank===2){ S.medals.silver++; medalTxt='🥈 银牌'; S.coins = (S.coins||0)+5; }
  else if(rank===3){ S.medals.bronze++; medalTxt='🥉 铜牌'; S.coins = (S.coins||0)+3; }
  S.meets.push({day:S.day, city, name:meet+' · 国际', rank});
  addLog(meet+' · 100米'+(strokeName()||'混合')+'（'+city+'）：'+rankTxt+(medalTxt?'，'+medalTxt:'')+'。', true);
  if(Math.random() < 0.40) gainItem('card', city, country);
  else if(Math.random() < 0.30) gainItem(pick(GENERICS));
  palPostcard();
  checkEndings();

  const rvExtra = rivalHook(meet, city, rank, true);
  let extra = '';
  [0.8, 0.6, 0.4].forEach(ch=>{ if(Math.random() < ch){ const e = makeFriend(city, true); if(e) extra += e; } });
  const bonusTxt = '<span style="font-size:12px;color:var(--ink-soft)">（划水节奏 '+hits+'/8，发挥'+(bonus>=0?'+':'')+bonus+(window._dqFlag?'；⚠ 抢跳两次，出发犯规':'')+'）</span>';
  showModal(meet+' · 100米'+(strokeName()||'混合'), city+'的水深比家里深。<br><br>'+bonusTxt+'<br><br>'+S.name+'拿到了<b>'+rankTxt+'</b>'+(medalTxt?'，'+medalTxt:'')+'。'+(rank===1?mateNote(WIN_NOTES):'')+fanLine(fan, rank)+extra+rvExtra);
  drainRival();
  if(meet==='奥运会' && rank===1){ forceEnd('champion'); }
  S.intCount = 0;
  save();
}

const SCALE = 2;
function px(x,y,w,h,c){ cx.fillStyle=c; cx.fillRect(Math.round(x)*SCALE, Math.round(y)*SCALE, w*SCALE, h*SCALE); }
const laneTxt = document.createElement('div');
laneTxt.id = 'laneTxt';
function attachLane(){
  const row = document.getElementById('laneRow');
  if(row && cv.parentElement !== row){ row.innerHTML=''; row.appendChild(cv); row.appendChild(laneTxt); }
}
function setLaneTxt(t){
  if(laneTxt.textContent !== t) laneTxt.textContent = t;
}
function skinC(){ return (S && S.skinColor) || '#ffd9b3'; }
function suitC(){ return (S && S.suitColor) || (S && S.gender==='m' ? '#5aa8cc' : '#e8798a'); }
function hairC(){ return (S && S.gender==='m') ? '#3a2a20' : '#7a4a2b'; }
function hairStyle(){ return S ? (S.hairstyle || (S.gender==='m' ? 'short' : 'long')) : 'long'; }

/* 俯视自由泳，面向右；frame: 0/1 换臂 */
function drawSwim(frame, x, y){
  const skin = skinC(), suit = suitC(), hair = hairC();
  // 打腿水花
  const ks = frame===0 ? 1 : -1;
  px(x-12, y-5+ks, 3, 2, 'rgba(255,255,255,.55)');
  px(x-12, y+3-ks, 3, 2, 'rgba(255,255,255,.55)');
  // 身体（泳衣）
  px(x-8, y-5, 16, 10, suit);
  px(x-9, y-3, 18, 6, suit);
  // 头 + 头发
  px(x+8, y-5, 10, 10, skin);
  const st = hairStyle();
  if(st==='long'){ px(x+8, y-6, 10, 12, hair); px(x+13, y-4, 5, 8, skin); px(x-4, y-3, 12, 6, hair); }
  else if(st==='pony'){ px(x+8, y-6, 10, 6, hair); px(x-2, y-4, 7, 4, hair); px(x-6, y-2, 4, 6, hair); }
  else { px(x+8, y-6, 10, 6, hair); px(x+8, y-6, 4, 12, hair); }
  // 划水臂
  if(frame===0){ px(x+17, y-2, 15, 4, skin); px(x-20, y-2, 12, 4, skin); px(x+32, y-3, 3, 6, 'rgba(255,255,255,.75)'); }
  else { px(x+10, y-8, 12, 4, skin); px(x-22, y+2, 14, 4, skin); px(x-22, y+4, 3, 5, 'rgba(255,255,255,.55)'); }
}
/* 站姿正面（撸铁 / 陆上动作共用）；y = 脚底基线；Q版短身比例；pose: 0 抱铃/垂臂， 1 平举， 2 举过头顶 */
function drawStand(pose, x, y, withBar){
  const skin = skinC(), suit = suitC(), hair = hairC();
  // 头发（后层）
  px(x, y-14, 10, 3, hair);
  const st = hairStyle();
  if(st==='long'){ px(x-1, y-12, 3, 7, hair); px(x+8, y-12, 3, 7, hair); }
  else if(st==='pony'){ px(x+11, y-13, 3, 8, hair); px(x+13, y-6, 2, 4, hair); }
  else { px(x-1, y-14, 12, 5, hair); }
  // 头
  px(x, y-13, 10, 8, skin);
  if(S && S.gender==='m'){ px(x-1, y-14, 12, 5, hair); }
  // 身体
  px(x-4, y-5, 18, 7, suit);
  // 腿 + 鞋
  px(x-2, y+2, 6, 5, skin); px(x+8, y+2, 6, 5, skin);
  px(x-3, y+7, 8, 3, suit); px(x+7, y+7, 8, 3, suit);
  // 杠铃 / 手臂
  if(withBar){
    const barY = pose===0 ? y-8 : (pose===1 ? y-11 : y-14);
    px(x-13, barY, 36, 3, '#cfd8dc');
    px(x-17, barY-3, 5, 9, '#37474f'); px(x+22, barY-3, 5, 9, '#37474f');
    px(x-13, barY-1, 4, 5, skin); px(x+19, barY-1, 4, 5, skin);
  }else{
    if(pose===0){ px(x-8, y-5, 4, 8, skin); px(x+14, y-5, 4, 8, skin); }
    else if(pose===1){ px(x-18, y-8, 12, 4, skin); px(x+16, y-8, 12, 4, skin); }
    else { px(x-12, y-15, 4, 9, skin); px(x+18, y-15, 4, 9, skin); }
  }
}
function drawLane(ts){
  cx.clearRect(0, 0, 480, 56);
  cx.imageSmoothingEnabled = false;
  const inGym = laneMode.type==='gym' && ts < laneMode.until;
  const inTech = laneMode.type==='tech' && ts < laneMode.until;
  const inSleep = laneMode.type==='sleep' && ts < laneMode.until;
  if(inSleep){ drawSleep(ts); return; }
  if(inGym || inTech){
    // 陆上：地板 + 哑铃架剪影
    cx.fillStyle='rgba(8,30,44,.45)'; cx.fillRect(0,0,480,72);
    px(0, 31, 240, 1, 'rgba(255,255,255,.12)');
    px(24, 14, 3, 16, 'rgba(255,255,255,.14)'); px(24, 12, 10, 3, 'rgba(255,255,255,.14)');
    px(170, 16, 3, 14, 'rgba(255,255,255,.10)'); px(170, 14, 9, 3, 'rgba(255,255,255,.10)');
    const pose = Math.floor(ts/300) % 3;
    if(inGym) drawStand(pose, 110, 27, true);
    else drawStand(pose, 110, 27, false);
    setLaneTxt(inGym ? '陆上力量 · 撸铁中' : '陆上技术 · 动作练习');
    return;
  }
  // 水面泳道
  cx.fillStyle='rgba(180,230,244,.10)'; cx.fillRect(0,0,480,72);
  // 泳道线（虚线，中线）
  cx.fillStyle='rgba(255,255,255,.30)';
  for(let x=6; x<468; x+=18){ cx.fillRect(x, 35, 9, 2); }
  // 分道线绳点
  cx.fillStyle='rgba(255,255,255,.22)';
  for(let x=0; x<480; x+=12){ cx.fillRect(x, 2, 5, 3); cx.fillRect(x, 67, 5, 3); }
  // 位置趋近
  laneP += (laneTarget - laneP) * 0.06;
  const sx = 26 + laneP * 176;
  const bob = Math.sin(ts/240) * 1.2;
  const strokeFast = Math.abs(laneTarget - laneP) > 0.01;
  const frame = Math.floor(ts / (strokeFast ? 140 : 500)) % 2;
  drawSwim(frame, sx, 18 + bob);
  // 水泡
  const bx = (sx - 40 - (ts/40)%60 + 480) % 480;
  cx.fillStyle='rgba(255,255,255,.25)';
  cx.fillRect(bx, 52, 3, 3); cx.fillRect(bx+14, 58, 2, 2);
  setLaneTxt('');
}
function laneLoop(ts){
  if(cv.isConnected) drawLane(ts);
  requestAnimationFrame(laneLoop);
}
requestAnimationFrame(laneLoop);
function laneSwim(){
  let nt = laneTarget + 0.18;
  if(nt >= 1){ S.laps = (S.laps||0) + 1; nt = 0; laneP = 0; toast('游完一整趟，转身！第 '+S.laps+' 趟'); }
  laneTarget = nt;
  S.swimX = nt;
}
function laneLand(type){
  laneMode = {type, until: performance.now() + (type==='sleep' ? 3200 : 2600)};
}
/* 睡觉动画：夜晚、躺着的小人、Zzz */
function drawSleep(ts){
  cx.fillStyle='rgba(5,22,38,.55)'; cx.fillRect(0,0,480,72);
  cx.imageSmoothingEnabled = false;
  // 月亮 + 闪爈的星星
  px(424, 10, 6, 6, 'rgba(255,236,180,.95)'); px(420, 13, 14, 4, 'rgba(255,236,180,.95)');
  const stars = [[40,12],[92,24],[160,10],[248,18],[330,14],[378,28]];
  cx.fillStyle='rgba(255,255,255,.6)';
  stars.forEach((s,i)=>{ if(Math.floor(ts/600)%2 === i%2) cx.fillRect(s[0], s[1], 3, 3); });
  // 床垫
  px(78, 42, 122, 8, 'rgba(255,255,255,.16)');
  px(78, 40, 10, 10, 'rgba(255,255,255,.22)');
  // 躺着的小人（头在右，闭眼）
  const skin = skinC(), suit = suitC(), hair = hairC();
  px(106, 36, 44, 8, suit);
  px(98, 37, 8, 6, suit);
  px(150, 34, 14, 9, skin);
  const st = hairStyle();
  if(st==='long'){ px(150, 32, 14, 4, hair); px(162, 32, 4, 11, hair); px(108, 32, 40, 4, hair); }
  else if(st==='pony'){ px(150, 32, 14, 4, hair); px(144, 33, 6, 8, hair); }
  else { px(150, 32, 14, 4, hair); }
  px(122, 32, 10, 4, skin);
  // Zzz 飘动
  const zoff = Math.floor(ts/350)%3;
  cx.fillStyle='rgba(242,251,253,.85)';
  cx.font='11px sans-serif'; cx.fillText('z', 168, 30 - zoff*5);
  cx.font='14px sans-serif'; cx.fillText('Z', 180, 24 - zoff*5);
  setLaneTxt('休息中 · 恢复体力');
}

/* ================= 好友聊天（微信风） / 送礼 ================= */
function chatWith(i){
  if((S.chats||0) >= chatLimit()){ toast('今天聊得够多啦，明天再找TA'); return; }
  const f = S.friends[i];
  const AVC = ['#e8a0a8','#8fbcd9','#9ecf9a','#c9a8d9','#e8c08a','#a0c4e8'];
  const favC = AVC[i % AVC.length];
  const topic = pick(CHAT_TOPICS);
  const opts = topic.opts.slice().sort(()=>Math.random()-0.5);
  const msgs = [];
  function bub(av, avc, me, text){
    return '<div class="wxRow'+(me?' me':'')+'"><div class="wxAv" style="background:'+avc+'">'+av+'</div><div class="bub">'+text+'</div></div>';
  }
  function draw(){
    const ended = st.phase === 'done';
    const foot = (ended && st.lastD !== undefined)
      ? '<div style="text-align:center;font-size:11px;color:#8a8a8a;margin-top:8px">好感度 '+(st.lastD>0?'+':'')+(st.lastD===0?'±0':st.lastD)+' · 当前 '+f.aff+'</div>' : '';
    let optsHtml;
    if(ended){
      optsHtml = '<button class="wxEnd" onclick="closeModal()">收起聊天</button>';
    } else {
      optsHtml = '<div class="wxFan">' + opts.map((o,k)=>{
        const rot = (k - (opts.length-1)/2) * 16;
        const isPick = st.picked === k && (st.phase === 'lift' || st.phase === 'flip');
        let cls = 'wxCard';
        if(isPick){ cls += (st.phase === 'flip' ? ' open' : ' chosen'); }
        else if(st.phase === 'lift' || st.phase === 'flip'){ cls += ' gone'; }
        const dt = o[1] > 0 ? '+'+o[1] : (o[1] === 0 ? '±0' : ''+o[1]);
        const dtColor = o[1] > 0 ? '#ffe28a' : (o[1] === 0 ? '#dfeaf2' : '#ffb3a0');
        return '<button class="'+cls+'" style="--rot:'+rot+'deg; z-index:'+(10+k)+'" onclick="wxReply('+i+','+k+')"><span class="back">✦<small>抽 一 张</small></span><span class="front">'+o[0]+'<span class="delta" style="color:'+dtColor+'">好感 '+dt+'</span></span></button>';
      }).join('') + '</div>';
    }
    showModal('与 '+f.name+' 聊天',
      '<div class="wxChat"><div class="wxMsgs">'+msgs.join('')+'</div><div class="wxOpts">'+optsHtml+'</div></div>'+foot, []);
  }
  const st = window._wxState = { i, f, favC, msgs, bub, draw, opts, phase:null, picked:-1, lastD:undefined };
  msgs.push(bub(f.name.charAt(0), favC, false, topic.open.replace(/\{city\}/g, f.city).replace(/\{name\}/g, f.name)));
  draw();
}
function wxReply(i, k){
  const st = window._wxState;
  if(!st || st.i !== i || st.phase) return;
  st.phase = 'lift'; st.picked = k;
  sfx('open');
  st.draw();
  setTimeout(()=>{
    if(window._wxState !== st) return;
    st.phase = 'flip';
    st.draw();
  }, 550);
  setTimeout(()=>{
    if(window._wxState !== st) return;
    const f = st.f;
    const pair = st.opts[k];
    const d = pair[1];
    st.phase = 'done';
    st.msgs.push(st.bub((S.name||'我').charAt(0), '#7bc86c', true, pair[0]));
    st.msgs.push(st.bub(f.name.charAt(0), st.favC, false, pick(d===3?RE_3:(d===1?RE_1:(d===0?RE_0:RE_M1)))));
    f.aff = Math.max(0, (f.aff||0) + d);
    st.lastD = d;
    S.chats = (S.chats||0) + 1;
    addLog('和'+f.name+'聊天，抽到「'+pair[0].slice(0,10)+'…」，好感度 '+(d>0?'+':'')+(d===0?'±0':d)+'（当前 '+f.aff+'）。');
    if(d > 0){
      // 好友独有加成：只有聊天能拿到
      if((f.stage||0) >= 1 && Math.random() < 0.5){
        S.coachUntil = S.day + 30;
        addLog('和'+f.name+'下水陪练了半小时，未来 30 天训练效果 +20%。');
        toast('🤝 陪练加成 · 30 天训练效果 +20%');
        sfx('sparkle');
      }
      if((f.stage||0) >= 2 && Math.random() < 0.3){
        S.talent = clamp(S.talent+1, 0, 100);
        addLog(f.name+'点拨了一个压箱底的技术细节，天赋 +1。', true);
        toast('💡 知己点拨 · 天赋 +1');
        sfx('sparkle');
      }
    }
    save(); checkAffStage(f); render();
    st.draw();
  }, 1150);
}
function closeModal(){ sfx('page'); $('modal').classList.remove('on'); $('modal').classList.remove('above'); flushMilestones(); drainEnvelope(); }
/* 手账分页：每页 10 条，页码可点 */
let _logPage = 0;
function renderLog(){
  const per = 10;
  const total = Math.max(1, Math.ceil(S.log.length/per));
  if(_logPage >= total) _logPage = total-1;
  if(_logPage < 0) _logPage = 0;
  const seg = S.log.slice(_logPage*per, _logPage*per+per);
  let html = seg.map(l=>
    '<div class="logItem'+(l.ev?' ev':'')+'"><span class="d">'+fmtD(l.d)+'</span>'+l.t+'</div>'
  ).join('') || '<div class="hint">还没有记录。</div>';
  if(total > 1){
    html += '<div class="logPager">';
    for(let p=0;p<total;p++){
      html += '<button class="pgBtn'+(p===_logPage?' on':'')+'" onclick="goLogPage('+p+')">'+(p+1)+'</button>';
    }
    html += '</div>';
  }
  $('logList').innerHTML = html;
}
function goLogPage(p){ sfx('tap'); _logPage = p; renderLog(); }

/* 好友分页：每页 6 张卡，页码可点（同手账翻页） */
let _frPage = 0;
function renderFriends(){
  const per = 6;
  const list = S.friends;
  const total = Math.max(1, Math.ceil(list.length/per));
  if(_frPage >= total) _frPage = total-1;
  if(_frPage < 0) _frPage = 0;
  const seg = list.slice(_frPage*per, _frPage*per+per);
  let html = seg.length ? seg.map((f,k)=>{
    const i = _frPage*per+k;
    return '<div class="friendCard"><canvas class="favatar" width="12" height="15" data-fi="'+i+'"></canvas><div class="fi"><div class="fn">'+f.name+'<span class="city">'+f.city+'</span>'+(f.stage?'<span class="stageTag">'+AFF_STAGES[f.stage-1].name+'</span>':'')+'</div><div class="fq">'+f.quirk+'</div><div class="fa">好感度 '+(f.aff||0)+' · 心动好物 <span class="heart">❤️</span>'+((f.fav||[]).map(id=>{const s=SOUVENIRS.find(x=>x.id===id);return s?s.icon:'';}).join(''))+'</div></div><div style="display:flex;flex-direction:column;gap:6px;"><button class="chatBtn" onclick="chatWith('+i+')">聊 天</button><button class="chatBtn" onclick="giftTo('+i+')">送礼物</button></div></div>';
  }).join('') : '<div class="hint">还没有朋友。去大城市比赛，会认识别的地区的人。</div>';
  if(total > 1){
    html += '<div class="logPager">';
    for(let p=0;p<total;p++) html += '<button class="pgBtn'+(p===_frPage?' on':'')+'" onclick="goFrPage('+p+')">'+(p+1)+'</button>';
    html += '</div>';
  }
  $('friendList').innerHTML = html;
}
function goFrPage(p){ sfx('tap'); _frPage = p; renderFriends(); }

function gainItem(id, place, country){
  sfx('sparkle');
  let key, icon, name, desc;
  if(place){
    key = id+'@'+place;
    if(id==='card'){ icon='🏙️'; name=place+'明信片'; desc='背面盖着'+place+'的邮戳'; }
    else{ icon='🧸'; name=place+'吉祥物'; desc='从'+place+'抱回来的赛事吉祥物'; }
  }else{
    const s = SOUVENIRS.find(x=>x.id===id);
    key=id; icon=s.icon; name=s.name; desc=s.desc;
  }
  const wasDup = !!S.items[key];
  if(wasDup) S.coins = (S.coins||0) + 5;
  S.items[key] = (S.items[key]||0)+1;
  let lit = '';
  if(place){
    const scope = country ? 'intl' : 'cn';
    const dk = country || place;
    if(!S.dex[scope][dk]){ S.dex[scope][dk]=true; lit = ' · 图鉴点亮 '+(country||place); }
  }
  addLog('拾到纪念品：'+icon+' '+name+'。'+(wasDup?'（重复 · 折 5 枚硬币）':''), true);
  toast(icon+' 获得 · '+name+lit);
  checkDexRewards();
}
function itemInfo(key){
  const at = key.indexOf('@');
  if(at<0){ const s = SOUVENIRS.find(x=>x.id===key); return s ? {icon:s.icon, name:s.name, desc:s.desc} : {icon:'🎁', name:key, desc:''}; }
  const id = key.slice(0,at), place = key.slice(at+1);
  if(id==='card'){
    const ph = photoOf(place);
    return {icon:'🏙️', name:place+'明信片', desc:(ph?('背面印着'+ph.name):'背面盖着'+place+'的邮戳'), place};
  }
  return {icon:'🧸', name:place+'吉祥物', desc:'从'+place+'抱回来的赛事吉祥物', place};
}
/* 图鉴 / 收藏点击查看大图 */
function tapDex(scope, key){

  else showModal(info.name, '<div class="pcBig">'+info.icon+'</div><div class="pcCap">×'+S.items[key]+' · '+info.desc+'</div>');

function pcImgHtml(ph, place){
  if(!ph || (!ph.pix && !ph.url)) return '<div class="pcBig">🏙️</div><div class="pcCap">'+(ph?ph.name:place)+'的风景，等你亲自去看</div>';
  if(ph.pix){
    const fb = ph.url ? imgUrl(ph.url) : '';
    return '<img class="pcImg pixImg" src="'+ph.pix+'" data-fallback="'+fb+'" onerror="pixFail(this)"><div class="pcCap">'+ph.name+'</div>';
  }
  const m = ph.url.match(/\/thumb\/(.+)\/(\d+)px-/);
  const path = m ? m[1] : '';
  const cur = m ? m[2]+'px' : '';
  const alts = ['500px','960px','330px','1280px'].filter(w=>w!==cur).join(',');
  return '<img class="pcImg" src="'+imgUrl(ph.url)+'" data-path="'+path+'" data-alts="'+alts+'" onerror="pcImgFail(this)"><div class="pcCap">'+ph.name+'</div>';
}
function viewPhoto(place, title){
  showModal(title, pcImgHtml(photoOf(place), place));
}
function pixFail(el){
  const fb = el.dataset.fallback;
  if(fb){
    el.dataset.fallback = '';
    el.classList.remove('pixImg');
    const m = fb.match(/\/thumb\/(.+)\/(\d+)px-/);
    el.dataset.path = m ? m[1] : '';
    el.dataset.alts = m ? ['500px','960px','330px','1280px'].filter(w=>w!==(m[2]+'px')).join(',') : '';
    el.onerror = function(){ pcImgFail(el); };
    el.src = fb;
    return;
  }
  const d = document.createElement('div');
  d.className = 'pcBig'; d.textContent = '🏙️';
  el.replaceWith(d);
}
function pcImgFail(el){
  const alts = (el.dataset.alts||'').split(',').filter(Boolean);
  const path = el.dataset.path||'';
  if(path && alts.length){
    const next = alts.shift();
    el.dataset.alts = alts.join(',');
    el.src = 'https://wsrv.nl/?url=upload.wikimedia.org/wikipedia/commons/thumb/' + path + '/' + next + '-' + path.split('/').pop();
    return;
  }
  const d = document.createElement('div');
  d.className = 'pcBig'; d.textContent = '🏙️';
  el.replaceWith(d);
}
function checkDexRewards(){
  if(!S.rewards.cn && CITIES.every(c=>S.dex.cn[c])){
    S.rewards.cn = true;
    sfx('chime');
    S.diligence = clamp(S.diligence+5, 0, 100);
    S.trained += 100;
    addLog('集齐了二十座城市的明信片——「山河邮戳」达成！勤奋 +5，训练量 +100。', true);
    showModal('山 河 邮 戳', '抽屉里的明信片攒了<b>二十座城市</b>。<br><br>从哈尔滨到海口，每一张背面都有邮戳。<br><br>奖励：勤奋 +5 · 训练量 +100');
  }
  if(!S.rewards.intl && INT_LOCS.every(l=>S.dex.intl[l.country])){
    S.rewards.intl = true;
    S.talent = clamp(S.talent+3, 0, 100);

function giftTo(i){

function giftItem(i, key){
  const f = S.friends[i];

  S.items[key]--;
  if(S.items[key] <= 0) delete S.items[key];
  const isFav = (f.fav||[]).includes(key.split('@')[0]);
  const gain = isFav ? ((f.stage||0)>=2 ? 4 : 3) : 1;
  f.aff = (f.aff||0) + gain;
  addLog('把'+info.name+'送给了'+f.name+'，好感度 +'+gain+'。', true);

function addLog(text, ev){
  S.log.unshift({d:S.day, t:text, ev:!!ev});

}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const raw = localStorage.getItem(SAVE_KEY); if(raw){ S = JSON.parse(raw);
    if(S.chats===undefined) S.chats=0;
    if(S.swimX===undefined) S.swimX=0;
  if(S.coins===undefined) S.coins = 0;
    if(S.laps===undefined) S.laps=0;
    if(!S.gender) S.gender='f';
    if(!S.items) S.items={};
    if(!S.dex) S.dex={cn:{}, intl:{}};
    if(!S.rewards) S.rewards={};
    if(!S.buffDay) S.buffDay=0;
    if(!S.ach) S.ach = {};
    ACH.forEach(a=>{ if(S.endings && S.endings[a.id]) S.ach[a.id] = true; });
    if(S.endings) Object.keys(S.endings).forEach(id=>seenEnd(id));
    if(!S.assess) S.assess = { next: S.day + 200, last: S.trained, streak: 0, fails: 0 };
    if(S.assess.streak===undefined) S.assess.streak = 0;
    if(S.assess.fails===undefined) S.assess.fails = 0;
    if(S.burn100===undefined) S.burn100 = 0;
  if(S.yearly===undefined) S.yearly = [];
  if(S.ySnap===undefined) S.ySnap = null;
  if(S.later===undefined) S.later = null;
    if(S.coachUntil===undefined) S.coachUntil = 0;
    if(S.meet7===undefined) S.meet7 = null;
    // 力量/技巧硬上限 100：把历史存档里溢出的部分压回去
    S.tech = Math.min(100, Math.max(0, S.tech));
    S.strength = Math.min(100, Math.max(0, S.strength));
    if(!S.mates || !S.mates.length) S.mates = buildMates();
    if(S.lastSeason === undefined) S.lastSeason = seasonOf(S.day);
    if(!S.globalMult) S.globalMult=1;
    if(!S.restStreak) S.restStreak=0;
    if(!S.startAge) S.startAge = S.age;
    if(!S.gear) S.gear={};
    if(!S.tapeUntil) S.tapeUntil=0;
    if(!S.roster) S.roster = buildRoster();
    if(!S.nameVer){ S.nameVer = 1; const _un = []; (S.roster||[]).forEach((p,i)=>{ if((S.metIdx||[]).indexOf(i)<0) p.n = rosterName(p,_un); }); }
    if(!S.mail) S.mail = {unlocked:false, letters:[], lastDay:0};
    if(S.rival === undefined) S.rival = null;
    if(!S.metIdx) S.metIdx=[];
    if(!S.endings) S.endings={};
    if(S.friends) S.friends.forEach(f=>{ if(!f.fav) f.fav = SOUVENIRS.slice().sort(()=>Math.random()-0.5).slice(0,2).map(s=>s.id); if(!f.stage) f.stage=0; });
    return true; } }catch(e){}
  return false;
}

let _hold = null;

    [
      {label:'稳住', cb:()=>{ holdTurn('hold'); }},
      {label:'压制', cb:()=>{ holdTurn('press'); }},
      {label:'赌一把', cb:()=>{ holdTurn('gamble'); }}
    ]);
}
function holdTurn(act){
  let meD = 0, rvD = 0, say = '';
  if(act==='hold'){ meD = 12; rvD = 10 + R(8); say = '你放慢呼吸，沉住气。'; }
  else if(act==='press'){ meD = 20; rvD = 18 + R(8); say = '你贴着TA打腿，寸步不让。'; }
  else{
    if(Math.random()<0.5){ rvD = 30 + R(8); say = '你猛地一记变速，TA呛了一口水花！'; }
    else { meD = 24 + R(6); say = '赌输了——你自己先乱了节奏。'; }
  }
  _hold.me = Math.max(0, _hold.me - meD);
  _hold.rv = Math.max(0, _hold.rv - rvD);
  _hold.round++;
  if(_hold.rv <= 0 || _hold.me <= 0 || _hold.round > 6){
    const win = _hold.rv <= 0 ? true : (_hold.me <= 0 ? false : (_hold.me === _hold.rv ? Math.random()<0.5 : _hold.me > _hold.rv));
    holdEnd(win, say);
    return;
  }
  _hold.log += say + '<br>';
  holdDuelShow();
}
function holdEnd(win, lastSay){
  const rv = S.rival;
  let extra;
  if(win){
    S.trained += 5;
    addLog('和'+rv.name+'比憋气，你赢了。（训练量 +5）', true);

    addLog('和'+rv.name+'比憋气，你先浮上来了。（'+rv.name+' 得意 +2）', true);
    extra = '「就这？」'+rv.name+'探出头，甩了甩头发上的水，「回去练练，我还等着赢你呢。」<br><br><b>你输了这场憋气对决。（'+rv.name+' 得意 +2）</b>';

function trialProgress(){
  if(S.trialIdx >= TRIALS.length) return 100;
  const lo = S.trialIdx===0 ? 0 : TRIALS[S.trialIdx-1];
  const hi = TRIALS[S.trialIdx];
  return clamp((S.trained-lo)/(hi-lo)*100, 0, 100);
}
function trialLabel(){
  if(S.trialIdx >= TRIALS.length) return 'MAX';
  return S.trained+'/'+TRIALS[S.trialIdx];
}

/* ================= 弹层 / 杂项 ================= */
function showModal(title, body, buttons){
  $('mdTitle').textContent = title;
  $('mdBody').innerHTML = body;
  const box = $('mdBtns');
  box.innerHTML = '';
  const bs = buttons || [{label:'知道了'}];
  bs.forEach(b=>{
    const el = document.createElement('button');
    el.className = 'btn small';
    el.textContent = b.label;
    el.onclick = () => { sfx('tap'); $('modal').classList.remove('on'); if(b.cb) b.cb(); if(S && !S.over) render(); flushMilestones(); drainEnvelope(); };
    box.appendChild(el);
  });
  $('modal').classList.add('on');
}
function toast(t){
  const el = $('toast');
  el.textContent = t; el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'), 1800);
}
function resetGame(){
  localStorage.removeItem(SAVE_KEY);
  S = null;
  $('modal').classList.remove('on');
  $('setModal').classList.remove('on');
  $('screenGame').style.display='none';
  $('btnSetting').style.display='none';
  $('screenCreate').style.display='block';
}

  const raw = localStorage.getItem(SAVE_KEY);
  if(raw && !window._forceNew){
    let o = null; try{ o = JSON.parse(raw); }catch(e){}
    if(o && !o.over){
      showModal('翻 新 手 账',

         {label:'仍 要 开 新 的', cb:()=>{ window._forceNew = true; $('btnStart').click(); }}]);

    }
  }
  window._forceNew = false;

/* 首页看成就：直接读存档里的成就记录，不进游戏 */
function showAchHome(){
  let o = null;
  try{ o = JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){}
  if(!o){ toast('还没有正在进行的旅程'); return; }
  const ach = o.ach || {};
  const rows = ACH.map(a=>{
    const got = !!ach[a.id];
    return '<div class="meetItem" style="text-align:left;'+(got?'':'opacity:.5;')+'">'+(got?'🏆':'✧')+' <b>'+a.t+'</b>'+(got?'':'<br><span style="font-size:12px;color:var(--ink-soft)">'+a.hint+'</span>')+'</div>';
  }).join('');
  const n = ACH.filter(a=>ach[a.id]).length;

    '已解锁 '+n+' / '+ACH.length+'（'+o.name+' · 第 '+o.day+' 天）<br><br>'+rows);
}

  $('screenGame').style.display='none';
  $('btnSetting').style.display='none';
  $('screenCreate').style.display='block';

function resumeGame(){
  if(!load()){ toast('没有找到存档'); return; }
  $('modal').classList.remove('on');
  $('setModal').classList.remove('on');
  $('screenCreate').style.display='none';
  $('screenGame').style.display='';
  $('btnSetting').style.display='';
  laneP = S.swimX || 0; laneTarget = laneP;
  render();
  if(S.over) showEndSummary();
  else if(S.meet7 && S.meet7.on) openPlane();
  else if(typeof S.tut === 'number'){ setTimeout(()=>tutShow(S.tut), 350); }
}
